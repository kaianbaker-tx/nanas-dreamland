function drawSky(){
  const g = CX.createLinearGradient(0,0,0,H);
  g.addColorStop(0, world.sky[0]);
  g.addColorStop(1, world.sky[1]);
  CX.fillStyle = g; CX.fillRect(0,0,W,H);

  const B = BACKDROPS[world.back] || BACKDROPS.grass;
  if (B.far) B.far();
  // clouds drift across every stage that has a sky
  for (let i=0; i<8 && B.clouds; i++){
    const cx = loopX(i*118 + game.t*0.08, .45, 80);
    const cy = 16 + ((i*67) % 74);
    puffCloud(cx, cy, 0.75 + (i%3)*0.22, B.clouds);
  }
  if (B.near) B.near();
}

/* ---------------- terrain ---------------- */
const TR = 6;
function isDirt(tx,ty){ return tileAt(tx,ty) === '#'; }
function dirtPath(tx,ty,grow){
  const g = grow || 0;
  const x = tx*TS - g, y = ty*TS - g, w = TS + g*2, h = TS + g*2;
  const up = isDirt(tx,ty-1), dn = isDirt(tx,ty+1), lf = isDirt(tx-1,ty), rt = isDirt(tx+1,ty);
  const tl = (!up && !lf) ? TR+g : 0, tr = (!up && !rt) ? TR+g : 0,
        br = (!dn && !rt) ? TR+g : 0, bl = (!dn && !lf) ? TR+g : 0;
  CX.beginPath();
  CX.moveTo(x+tl, y);
  CX.lineTo(x+w-tr, y); if (tr) CX.quadraticCurveTo(x+w, y, x+w, y+tr);
  CX.lineTo(x+w, y+h-br); if (br) CX.quadraticCurveTo(x+w, y+h, x+w-br, y+h);
  CX.lineTo(x+bl, y+h); if (bl) CX.quadraticCurveTo(x, y+h, x, y+h-bl);
  CX.lineTo(x, y+tl); if (tl) CX.quadraticCurveTo(x, y, x+tl, y);
  CX.closePath();
}
function drawStarBlock(x,y){
  rr(x+1.2, y+1.2, TS-2.4, TS-2.4, 4);
  CX.strokeStyle = OUT_T; CX.lineWidth = 2.6; CX.stroke();
  CX.fillStyle = '#e79a34'; CX.fill();
  rr(x+2.6, y+2.6, TS-5.2, TS-5.2, 3);
  CX.fillStyle = '#ffc25c'; CX.fill();
  drawStarShape(x+TS/2, y+TS/2 + .4, 4.8, 0, '#fff2b8', '#c97c14');
}
/* what the ground is made of, painted inside one tile */
function soilTex(P, tx, ty, x, y, capped){
  const h = thash(tx,ty), h2 = thash(tx+9,ty);
  switch (P.tex){
    case 'pancake':          // a stack of pancakes, three to a tile
      for (let j=0;j<3;j++){
        const ly = y + j*5.34;
        CX.fillStyle = P.dl; CX.fillRect(x, ly + .8, TS, 1.2);
        CX.fillStyle = P.dd; CX.fillRect(x, ly + 4.1, TS, 1.3);
      }
      if (h > .45){ CX.fillStyle = P.dd; circle(x + 3 + h*10, y + 9 + h2*4, .9); CX.fill(); }
      break;
    case 'custard':          // wobbly custard sitting on caramel
      CX.fillStyle = P.dl; ell(x + 4 + h*8, y + (capped ? 11 : 5), 3.2, 1.3); CX.fill();
      CX.fillStyle = P.dd;
      if (h2 > .5){ circle(x + 3 + h2*10, y + 13 - h*4, .7); CX.fill(); }
      if (!isDirt(tx, ty+1)){
        CX.fillRect(x, y + 11, TS, 5);
        CX.fillStyle = '#eeb05a'; CX.fillRect(x, y + 11, TS, 1.3);
      }
      break;
    case 'sugar':            // one sugar cube per tile
      CX.fillStyle = P.dd;
      CX.fillRect(x, y + TS - 1.3, TS, 1.3); CX.fillRect(x + TS - 1.3, y, 1.3, TS);
      for (let i=0;i<4;i++){ circle(x + 2 + thash(tx+i*5, ty+i)*12, y + 2 + thash(tx, ty+i*3)*12, .6); CX.fill(); }
      if (h > .72){
        CX.globalAlpha = .5 + .5*Math.sin(game.t*0.08 + h*20);
        twinkle(x + 4 + h2*8, y + (capped ? 10 : 5) + h*3, 2.2, '#ffffff');
        CX.globalAlpha = 1;
      }
      break;
    case 'choc':             // chocolate bar squares
      for (let j=0;j<2;j++) for (let i=0;i<2;i++){
        if (capped && j === 0) continue;
        const sx = x + i*8, sy = y + j*8;
        CX.fillStyle = P.dd; CX.fillRect(sx + 6.8, sy, 1.2, 8); CX.fillRect(sx, sy + 6.8, 8, 1.2);
        CX.fillStyle = P.dl; CX.fillRect(sx + 1, sy + 1, 5.2, 1.1); CX.fillRect(sx + 1, sy + 1, 1.1, 5.2);
      }
      break;
    case 'sand':
      CX.fillStyle = P.dd;
      for (let i=0;i<5;i++){
        circle(x + 1 + thash(tx+i*3, ty+i*7)*14, y + (capped ? 8 : 1) + thash(tx+i, ty-i)*(capped ? 7 : 14), .7); CX.fill();
      }
      if (h > .84){ CX.fillStyle = '#f7b6c2'; ell(x + 5 + h2*6, y + 12, 2.2, 1.4); CX.fill(); }
      break;
    case 'soil':             // dark jungle dirt with roots through it
      CX.strokeStyle = P.dd; CX.lineWidth = 1.2;
      if (h > .4){
        CX.beginPath(); CX.moveTo(x + h*16, y + (capped ? 8 : 0));
        CX.quadraticCurveTo(x + h2*16, y + 11, x + 8, y + 16); CX.stroke();
      }
      if (h2 > .55){ CX.fillStyle = P.dl; ell(x + 3 + h2*9, y + 12, 1.8, 1.2); CX.fill(); }
      break;
    case 'night':            // night-sky stuff, little stars inside
      if (h > .5){
        CX.globalAlpha = .4 + .6*Math.abs(Math.sin(game.t*0.03 + h*30));
        twinkle(x + 3 + h2*10, y + (capped ? 10 : 3) + h*4, 1.7, '#fff6c8');
        CX.globalAlpha = 1;
      }
      if (h2 > .7){ CX.fillStyle = P.dl; circle(x + 2 + h*11, y + 13, .9); CX.fill(); }
      break;
    default: {               // brickwork: offset seams row by row
      CX.fillStyle = P.dd;
      CX.fillRect(x, y + (capped ? 11 : 7), TS, 1.6);
      const seam = (ty % 2) ? x : x + 8;
      CX.fillRect(seam, y + (capped ? 12 : 8), 1.6, 8);
      CX.fillRect(seam + 8, y + (capped ? 4 : 0), 1.6, 7);
      if (capped){ CX.fillStyle = P.dl; CX.fillRect(x, y + 7, TS, 2); }
      CX.fillStyle = P.dl;
      if (h > .5) circle(x + 3 + h*9, y + (capped?15:4), 1.4), CX.fill();
      if (h2 > .62) circle(x + 4 + h2*8, y + 12, 1.1), CX.fill();
    }
  }
}

/* whatever covers the top of the ground, painted inside the tile */
function capTop(P, tx, ty, x, y){
  const h = thash(tx,ty);
  switch (P.cap){
    case 'drip': {           // syrup / frosting poured over the top, running down
      CX.fillStyle = P.gd; CX.fillRect(x, y, TS, 7.4);
      CX.fillStyle = P.g;  CX.fillRect(x, y, TS, 6);
      const n = h > .5 ? 2 : 1;
      for (let i=0;i<n;i++){
        const dx = x + 3 + thash(tx + i*7, ty + 3)*10, len = 3 + thash(tx + i*3, ty + 1)*7;
        CX.fillStyle = P.gd; rr(dx - 2.3, y + 3, 4.6, len + 4.6, 2.3); CX.fill();
        CX.fillStyle = P.g;  rr(dx - 1.6, y + 3, 3.2, len + 3.4, 1.6); CX.fill();
        CX.fillStyle = P.gl; ell(dx - .5, y + len + 4.2, .7, 1.1); CX.fill();
      }
      CX.fillStyle = P.gl; CX.fillRect(x, y + 1.2, TS, 1.5);
      break;
    }
    case 'puff':             // cloud / pillow top
      CX.fillStyle = P.gd;
      for (let i=0;i<3;i++){ circle(x + 2.6 + i*5.4, y + 7.6, 3); CX.fill(); }
      CX.fillStyle = P.g; CX.fillRect(x, y, TS, 7);
      for (let i=0;i<3;i++){ circle(x + 2.6 + i*5.4, y + 6.4, 2.8); CX.fill(); }
      break;
    case 'sand':
      CX.fillStyle = P.g; CX.fillRect(x, y, TS, 5);
      for (let i=0;i<4;i++){ circle(x + 2 + i*4, y + 5, 2.1); CX.fill(); }
      CX.fillStyle = P.gl; CX.fillRect(x, y, TS, 1.8);
      CX.strokeStyle = P.gd; CX.lineWidth = .9;
      CX.beginPath(); CX.arc(x + 4 + h*8, y + 6.5, 3, Math.PI*1.2, Math.PI*1.8); CX.stroke();
      break;
    case 'leaf':             // moss with leaf tips hanging over the edge
      for (let i=0;i<2;i++){
        const lx = x + 1 + i*8 + h*2;
        CX.fillStyle = P.gd;
        CX.beginPath(); CX.moveTo(lx, y + 5); CX.quadraticCurveTo(lx + 3, y + 13 + h*2, lx + 7, y + 5); CX.fill();
      }
      CX.fillStyle = P.g;  CX.fillRect(x, y, TS, 7);
      CX.fillStyle = P.gl; CX.fillRect(x, y, TS, 2.5);
      break;
    default:                 // grass
      CX.fillStyle = P.g;  CX.fillRect(x, y, TS, 7);
      CX.fillStyle = P.gl; CX.fillRect(x, y, TS, 2.5);
      CX.fillStyle = P.g;
      for (let i=0;i<3;i++){ circle(x + 2.6 + i*5.4, y + 7, 2.7); CX.fill(); }
  }
  if (P.spots){              // it's a banana peel, so it gets brown spots
    CX.fillStyle = '#8a5a1a';
    if (h > .3){ ell(x + 3 + h*9, y + 3.6, 1.2, .8); CX.fill(); }
    if (h < .6){ ell(x + 12 - h*6, y + 5, .8, .6); CX.fill(); }
  }
  if (P.sprinkles){
    const cols = ['#ffffff','#7ee0ff','#ffe45c','#9dffb0','#ff5c7a'];
    for (let i=0;i<3;i++){
      const a = thash(tx + i*11, ty + i*5);
      CX.save(); CX.translate(x + 2 + a*12, y + 2 + thash(tx, ty + i*7)*3); CX.rotate(a*6);
      CX.fillStyle = cols[(tx + ty + i) % 5]; CX.fillRect(-1.6, -.6, 3.2, 1.2);
      CX.restore();
    }
  }
}

/* bits that poke up above the top edge: grass tufts, cloud bumps, shells, ferns.
   pass 0 draws ink under everything, pass 1 the color on top, so bumps merge */
function capOver(P, tx, ty, x, y, pass){
  const h = thash(tx+3,ty);
  switch (P.cap){
    case 'puff': {
      const n = h > .5 ? 2 : 1;
      for (let i=0;i<n;i++){
        const r = 3.4 + thash(tx+i, ty+5)*1.8;
        let bx = x + 4 + thash(tx + i*5, ty)*8;
        if (!isDirt(tx-1,ty)) bx = Math.max(bx, x + r + 3);
        if (!isDirt(tx+1,ty)) bx = Math.min(bx, x + TS - r - 3);
        const by = y + .6;
        if (pass === 0){
          CX.strokeStyle = P.out; CX.lineWidth = 3.4;
          CX.beginPath(); CX.arc(bx, by, r, Math.PI, 0); CX.stroke();
        } else {
          CX.fillStyle = P.g; circle(bx, by, r); CX.fill();
          CX.fillStyle = P.gl; ell(bx - r*.3, by - r*.4, r*.4, r*.25); CX.fill();
        }
      }
      break;
    }
    case 'sand':
      if (pass === 0) break;
      if (h > .86){          // beach grass
        CX.strokeStyle = '#4f9e3a'; CX.lineWidth = 1.2; CX.lineCap = 'round';
        const bx = x + 4 + h*6;
        for (const d of [-3, 0, 3]){ CX.beginPath(); CX.moveTo(bx, y + 1); CX.quadraticCurveTo(bx + d*.5, y - 3, bx + d, y - 6 + Math.abs(d)*.6); CX.stroke(); }
        CX.lineCap = 'butt';
      } else if (h < .1){    // a shell
        const bx = x + 5 + h*50;
        CX.beginPath(); CX.moveTo(bx - 3.2, y + 1); CX.arc(bx, y + 1, 3.2, Math.PI, 0); CX.closePath();
        ink('#ffb3c2', 1);
      }
      break;
    case 'leaf':
      if (pass === 0) break;
      if (h > .45){          // ferns
        CX.fillStyle = P.gl;
        const bx = x + 3 + h*9;
        for (const d of [-1, 1]){
          CX.beginPath(); CX.moveTo(bx, y + 2); CX.quadraticCurveTo(bx + d*2, y - 6, bx + d*6, y - 7);
          CX.quadraticCurveTo(bx + d*2, y - 2, bx, y + 2); CX.fill();
        }
      }
      if (h < .14){          // a jam-red flower
        const bx = x + 8, by = y - 3;
        CX.strokeStyle = P.gd; CX.lineWidth = 1.2; CX.beginPath(); CX.moveTo(bx, y + 1); CX.lineTo(bx, by); CX.stroke();
        CX.fillStyle = '#ff4f6d';
        for (let k=0;k<5;k++){ const a = k*Math.PI*2/5; circle(bx + Math.cos(a)*2.4, by + Math.sin(a)*2.4, 1.8); CX.fill(); }
        CX.fillStyle = '#ffd93b'; circle(bx, by, 1.3); CX.fill();
      }
      break;
    case 'drip':
      if (pass === 1 && P.butter && h > .8){   // a pat of butter on the pancakes
        rr(x + 4, y - 3, 8, 5, 1.5); ink('#fff3a0', 1.2);
        CX.fillStyle = '#ffffff'; CX.fillRect(x + 5.5, y - 2, 3, 1);
      }
      break;
    default:                 // grass tufts poking up over the lip
      if (pass === 1 && h > .55){
        CX.fillStyle = P.gl;
        const bx = x + 3 + h*9;
        CX.beginPath(); CX.moveTo(bx-2, y+1); CX.quadraticCurveTo(bx, y-4, bx+2, y+1); CX.fill();
      }
  }
}

function drawTiles(){
  const x0 = Math.max(0, Math.floor(cam.x/TS) - 1), x1 = Math.min(MAPW-1, Math.ceil((cam.x+W)/TS));
  const y0 = Math.max(0, Math.floor(cam.y/TS) - 1), y1 = Math.min(MAPH-1, Math.ceil((cam.y+H)/TS));
  const P = world.pal || PAL_GRASS;
  const isCapped = (tx,ty) => !isDirt(tx,ty-1) && tileAt(tx,ty-1) !== 'X';

  // 1 — silhouette
  CX.fillStyle = P.out || OUT_T;
  for (let ty=y0; ty<=y1; ty++) for (let tx=x0; tx<=x1; tx++)
    if (isDirt(tx,ty)){ dirtPath(tx,ty,2); CX.fill(); }
  // 2 — body
  CX.fillStyle = P.d;
  for (let ty=y0; ty<=y1; ty++) for (let tx=x0; tx<=x1; tx++)
    if (isDirt(tx,ty)){ dirtPath(tx,ty,0); CX.fill(); }
  // 3 — soil texture and whatever covers the top
  for (let ty=y0; ty<=y1; ty++) for (let tx=x0; tx<=x1; tx++){
    if (!isDirt(tx,ty)) continue;
    const x = tx*TS, y = ty*TS, capped = isCapped(tx,ty);
    CX.save(); dirtPath(tx,ty,0); CX.clip();
    soilTex(P, tx, ty, x, y, capped);
    if (capped) capTop(P, tx, ty, x, y);
    CX.restore();
  }
  // 3b — what pokes up over the lip
  for (let pass=0; pass<2; pass++)
    for (let ty=y0; ty<=y1; ty++) for (let tx=x0; tx<=x1; tx++)
      if (isDirt(tx,ty) && isCapped(tx,ty)) capOver(P, tx, ty, tx*TS, ty*TS, pass);
  // 4 — star blocks and spikes
  for (let ty=y0; ty<=y1; ty++) for (let tx=x0; tx<=x1; tx++){
    const c = map[ty][tx];
    if (c === 'X') drawStarBlock(tx*TS, ty*TS);
    else if (c === '^'){
      const x = tx*TS, y = ty*TS;
      CX.fillStyle = P.spk || '#e6ecf7'; CX.strokeStyle = OUT; CX.lineWidth = 1.5;
      for (let i=0;i<3;i++){
        CX.beginPath();
        CX.moveTo(x + i*5.4 + .6, y+TS); CX.lineTo(x + i*5.4 + 2.7, y+3.5); CX.lineTo(x + i*5.4 + 4.8, y+TS);
        CX.closePath(); CX.fill(); CX.stroke();
      }
      CX.fillStyle = P.spkb || '#8c97b5'; rr(x, y+TS-3.5, TS, 3.5, 1.5); CX.fill();
    }
  }
}

/* ---------------- Kolby ---------------- */
function drawKolby(){
  if (pl.inv > 0 && !pl.dead && Math.floor(game.t/3) % 2 === 0) return;

  const cx = pl.x + pl.w/2, cy = pl.y + pl.h/2;
  let rx = 8.6, ry = 8.6;
  if (pl.floating){ rx = 9.8; ry = 9.8; }
  if (pl.mouthful){ rx = 10.4; ry = 9.6; }
  if (pl.inhaling > 3){ rx = 8.2; ry = 9.0; }
  const sq = pl.squish > 0 ? pl.squish : 0;
  rx *= 1 + sq*0.25; ry *= 1 - sq*0.25;

  const dir = pl.dir;
  const walking = pl.onGround && Math.abs(pl.vx) > .2;
  const step = walking ? Math.sin(pl.walkT*3) : 0;
  const y = cy + (walking ? Math.abs(step)*-0.8 : 0);

  CX.fillStyle = 'rgba(40,20,60,.16)';
  ell(cx, pl.y + pl.h + 2, rx*0.82, 2.5); CX.fill();

  // wings from a swallowed flyer: flapping when flying, droopy and grey while they rest
  if (pl.wings){
    const flying = pl.floating && onWings();
    const f = flying ? Math.sin(game.t*0.55) : Math.sin(game.t*0.08)*0.25;
    const col = pl.wingRest ? '#cfc6e0' : '#ffffff';
    const ax = cx - dir*5, ay = y - 2, droop = pl.wingRest ? 0.9 : 0;
    for (const [a, len] of [[1.15, 7], [0.75, 9], [0.35, 8]]){     // three feathers, fanned
      const t = a + f*0.35 - droop;
      const vx = -dir*Math.cos(t), vy = -Math.sin(t);
      ell(ax + vx*len*0.9, ay + vy*len*0.9, len, 2.8, Math.atan2(vy, vx)); ink(col, 1.2);
    }
  }

  // spikes popping out all around him
  if (pl.spikeT > 0){
    const out = Math.min(1, (SPIKE_TIME - pl.spikeT + 1)/5) * Math.min(1, pl.spikeT/5 + 0.3);
    const R = 8 + (SPIKE_R - 8)*out;
    CX.fillStyle = '#f4f7ff'; CX.strokeStyle = OUT; CX.lineWidth = 1;
    for (let i=0;i<10;i++){
      const a = i/10*Math.PI*2 + game.t*0.03;
      CX.beginPath();
      CX.moveTo(cx + Math.cos(a-0.32)*8, y + Math.sin(a-0.32)*8);
      CX.lineTo(cx + Math.cos(a)*R, y + Math.sin(a)*R);
      CX.lineTo(cx + Math.cos(a+0.32)*8, y + Math.sin(a+0.32)*8);
      CX.closePath(); CX.fill(); CX.stroke();
    }
  }

  // feet — big angled ovals, back one darker
  const fy = y + ry - 0.2;
  CX.fillStyle = '#d94a2e';
  ell(cx - dir*5.2 - step*2.2, fy, 4.6, 3.1, -dir*0.3); ink('#d94a2e', 1.5);
  CX.fillStyle = '#f4663f';
  ell(cx + dir*4.4 + step*2.2, fy + 0.3, 5.0, 3.3, dir*0.28); ink('#f4663f', 1.5);

  // arm nubs
  const armSw = pl.floating ? Math.sin(game.t*0.3)*2.2 : step*1.4;
  ell(cx - dir*(rx+0.6), y + 0.4 + armSw*0.4, 3.6, 2.8, -dir*0.5); ink('#ffcf2e', 1.5);

  // body
  ell(cx, y, rx, ry); ink('#ffd93b', 1.8);
  CX.save(); ell(cx, y, rx, ry); CX.clip();
  CX.fillStyle = '#f0b400'; ell(cx + dir*3, y + 5, rx*0.95, ry*0.55); CX.fill();
  CX.fillStyle = '#fff29a'; ell(cx - dir*3.4, y - 4.2, rx*0.42, ry*0.3, -dir*0.5); CX.fill();
  CX.restore();

  // front arm over the body
  ell(cx + dir*(rx-1.4), y + 1.6 - armSw*0.4, 3.5, 2.7, dir*-0.42); ink('#ffd93b', 1.5);

  blush(cx + dir*5.0, y + 2.2, 2.6, 1.8);
  blush(cx - dir*5.4, y + 2.6, 1.8, 1.3);

  const eyeY = y - 2.8;
  if (pl.hurtT > 0){                        // squeezed-shut eyes
    CX.strokeStyle = OUT; CX.lineWidth = 1.4;
    for (const ex of [cx + dir*1.2, cx + dir*5.2]){
      CX.beginPath(); CX.arc(ex, eyeY+1.5, 2.2, Math.PI+.3, -.3); CX.stroke();
    }
  } else {
    eye(cx + dir*1.2, eyeY, 1.7, 3.4);
    eye(cx + dir*5.2, eyeY, 1.7, 3.4);
  }

  if (pl.spiky) spikyHat(cx - dir*0.8, y - ry - 0.8, pl.spikeCool > 0 && !pl.spikeT);

  // mouth
  if (pl.inhaling > 3){
    const s = 1 + Math.sin(game.t*0.6)*0.12;
    ell(cx + dir*4.6, y + 4.2, 2.7*s, 3.2*s); ink('#7d2438', 1.3);
    CX.fillStyle = '#ff9fb5'; ell(cx + dir*4.6, y + 5.2, 1.3*s, 1.2*s); CX.fill();
    CX.strokeStyle = 'rgba(255,255,255,.8)'; CX.lineWidth = 1.3;
    for (let i=0;i<3;i++){
      const off = ((game.t*2.4 + i*16) % 48);
      CX.globalAlpha = 1 - off/48;
      CX.beginPath();
      CX.arc(cx + dir*(7 + off), y + 2, 5 + off*0.2, dir>0 ? -1 : Math.PI-1, dir>0 ? 1 : Math.PI+1);
      CX.stroke();
    }
    CX.globalAlpha = 1;
  } else if (pl.mouthful){
    ell(cx + dir*3.4, y + 3.8, 1.5, 1.1); CX.fillStyle = '#7d2438'; CX.fill();
    CX.fillStyle = 'rgba(240,170,0,.55)'; ell(cx + dir*6.6, y + 1.4, 3.2, 3.6); CX.fill();
  } else if (pl.floating){
    ell(cx + dir*3.9, y + 3.7, 2.1, 2.3); ink('#7d2438', 1.2);
  } else {
    CX.strokeStyle = '#7d2438'; CX.lineWidth = 1.3; CX.lineCap = 'round';
    CX.beginPath(); CX.arc(cx + dir*3.4, y + 2.2, 2.2, 0.2, Math.PI - 0.2); CX.stroke();
    CX.lineCap = 'butt';
  }
}

/* ---------------- enemies ---------------- */
function drawEnemy(e){
  const cx = e.x + e.w/2, cy = e.y + e.h/2;
  const pulled = e.state === 'pulled';
  CX.save();
  if (pulled){ CX.translate(cx, cy); CX.rotate(Math.sin(game.t*0.5)*0.45); CX.scale(.78,.78); CX.translate(-cx,-cy); }

  if (e.type === 'walker'){
    CX.fillStyle = 'rgba(40,20,60,.15)'; ell(cx, e.y+e.h+1, 6.2, 2); CX.fill();
    const st = Math.sin(e.t*0.16)*1.6;
    ell(cx - 3.8 - st, e.y+e.h-1.4, 3.4, 2.3, -.25); ink('#d94a2e',1.4);
    ell(cx + 3.8 + st, e.y+e.h-1.4, 3.4, 2.3,  .25); ink('#f4663f',1.4);
    ell(cx, cy, 7.2, 6.6); ink('#ff9d5c', 1.7);
    CX.save(); ell(cx, cy, 7.2, 6.6); CX.clip();
    CX.fillStyle = '#ffd3a8'; ell(cx, cy+2.2, 4.6, 3.4); CX.fill();
    CX.fillStyle = '#ffc79a'; ell(cx-3, cy-3.4, 2.6, 1.6, -.4); CX.fill();
    CX.restore();
    eye(cx - 2.3, cy - 1.4, 1.3, 2.2);
    eye(cx + 2.3, cy - 1.4, 1.3, 2.2);
    blush(cx - 5.2, cy + 1.2, 1.6, 1.1); blush(cx + 5.2, cy + 1.2, 1.6, 1.1);
  }
  else if (e.type === 'flyer'){
    const f = Math.sin(game.t*0.5) * 3.2;
    CX.save();
    ell(cx - 6.0, cy - 2.6 - f*0.3, 4.0, 2.2, -0.75 - f*0.10); ink('#ffd9ee',1.2);
    ell(cx + 6.0, cy - 2.6 - f*0.3, 4.0, 2.2,  0.75 + f*0.10); ink('#ffd9ee',1.2);
    CX.restore();
    ell(cx, cy, 6.6, 6.0); ink('#ff9ecb', 1.7);
    CX.save(); ell(cx, cy, 6.6, 6.0); CX.clip();
    CX.fillStyle = '#ffc2e0'; ell(cx-2.6, cy-3, 2.8, 1.7, -.4); CX.fill();
    CX.restore();
    eye(cx - 2.1, cy - 0.9, 1.2, 2.1);
    eye(cx + 2.1, cy - 0.9, 1.2, 2.1);
    CX.strokeStyle = OUT; CX.lineWidth = 1.1;
    CX.beginPath(); CX.arc(cx, cy + 2.4, 1.7, 0.25, Math.PI-0.25); CX.stroke();
  }
  else { // spiky — the one you can't swallow
    CX.fillStyle = 'rgba(40,20,60,.15)'; ell(cx, e.y+e.h+1, 6, 2); CX.fill();
    const n = 10;
    CX.fillStyle = '#dfe6f5'; CX.strokeStyle = OUT; CX.lineWidth = 1.2;
    for (let i=0;i<n;i++){
      const a = (i/n)*Math.PI*2 + Math.sin(game.t*0.02)*0.1;
      CX.beginPath();
      CX.moveTo(cx + Math.cos(a-0.28)*5, cy + Math.sin(a-0.28)*5);
      CX.lineTo(cx + Math.cos(a)*9.6, cy + Math.sin(a)*9.6);
      CX.lineTo(cx + Math.cos(a+0.28)*5, cy + Math.sin(a+0.28)*5);
      CX.closePath(); CX.fill(); CX.stroke();
    }
    circle(cx, cy, 6.2); ink('#4b4a6b', 1.7);
    CX.save(); circle(cx, cy, 6.2); CX.clip();
    CX.fillStyle = '#6d6b92'; ell(cx-2.4, cy-2.8, 2.6, 1.5, -.4); CX.fill();
    CX.restore();
    eye(cx - 2.2, cy - 0.4, 1.3, 2.0);
    eye(cx + 2.2, cy - 0.4, 1.3, 2.0);
    CX.strokeStyle = '#ffffff'; CX.lineWidth = 1.2;
    CX.beginPath(); CX.arc(cx, cy + 4.4, 1.9, Math.PI+0.25, -0.25); CX.stroke();
  }
  CX.restore();
}

/* ---------------- items ---------------- */
function drawBanana(x,y,s){
  CX.save(); CX.translate(x,y); CX.scale(s||1,s||1);
  CX.beginPath();
  CX.moveTo(-5.8, -4.0); CX.quadraticCurveTo(-2.2, 7.4, 6.8, 4.6);
  CX.quadraticCurveTo(1.4, 2.2, -2.2, -4.6);
  CX.closePath();
  CX.fillStyle = '#ffd93b'; CX.fill();
  CX.strokeStyle = '#a8760a'; CX.lineWidth = 0.9; CX.stroke();
  CX.save(); CX.clip();
  CX.fillStyle = '#fff09a';
  CX.beginPath(); CX.moveTo(-5.4,-3.6); CX.quadraticCurveTo(-2.4,4.4,4.6,3.4);
  CX.quadraticCurveTo(-0.6,1.6,-3.4,-3.8); CX.fill();
  CX.restore();
  CX.fillStyle = '#6b4a12'; rr(-6.8, -6.0, 2.6, 2.6, 1); CX.fill();
  CX.restore();
}
function drawStarShape(x,y,r,rot,col,outCol){
  CX.save(); CX.translate(x,y); CX.rotate(rot||0);
  CX.beginPath();
  for (let i=0;i<10;i++){
    const a = -Math.PI/2 + i*Math.PI/5;
    const rr2 = i%2 ? r*0.44 : r;
    CX.lineTo(Math.cos(a)*rr2, Math.sin(a)*rr2);
  }
  CX.closePath();
  CX.fillStyle = col || '#fff6a8'; CX.fill();
  if (outCol !== null){ CX.strokeStyle = outCol || OUT; CX.lineWidth = 1.4; CX.lineJoin='round'; CX.stroke(); }
  CX.restore();
}
/* the little 4-point sparkle that goes off constantly in these games */
function twinkle(x,y,r,col){
  CX.save(); CX.translate(x,y);
  CX.fillStyle = col || '#ffffff';
  CX.beginPath();
  CX.moveTo(0,-r); CX.quadraticCurveTo(0,0, r,0);
  CX.quadraticCurveTo(0,0, 0,r); CX.quadraticCurveTo(0,0, -r,0);
  CX.quadraticCurveTo(0,0, 0,-r);
  CX.fill(); CX.restore();
}
function drawPickup(p){
  const cx = p.x + p.w/2, cy = p.y + p.h/2 + Math.sin(p.t*0.08)*1.6;
  if (p.kind === 'banana') drawBanana(cx, cy, 1.2);
  else if (p.kind === 'heart'){
    CX.beginPath();
    CX.moveTo(cx, cy+5.8);
    CX.bezierCurveTo(cx-8, cy-0.5, cx-4.4, cy-6.4, cx, cy-2.4);
    CX.bezierCurveTo(cx+4.4, cy-6.4, cx+8, cy-0.5, cx, cy+5.8);
    CX.closePath(); ink('#ff5c7a', 1.5);
    CX.fillStyle = 'rgba(255,255,255,.7)'; ell(cx-2.4, cy-1.8, 1.4, 1.0, -.5); CX.fill();
  }
  else if (p.kind === 'life'){
    circle(cx, cy, 7.6); ink('#9dffb0', 1.6);
    circle(cx, cy, 5.4); ink('#ffd93b', 1.3);
    eye(cx-1.8, cy-0.6, 0.9, 1.6); eye(cx+1.8, cy-0.6, 0.9, 1.6);
    blush(cx-3.7, cy+1.4, 1.2, .9); blush(cx+3.7, cy+1.4, 1.2, .9);
  }
  else if (p.kind === 'star'){
    CX.globalAlpha = .3 + Math.sin(p.t*0.12)*0.16;
    drawStarShape(cx, cy, 12 + Math.sin(p.t*0.12)*2, -p.t*0.04, '#fff6a8', null);
    CX.globalAlpha = 1;
    drawStarShape(cx, cy, 7.4, p.t*0.07, '#ffe45c');
    CX.fillStyle = '#fffbe0'; ell(cx-1.6, cy-2, 1.5, 1.1, -.4); CX.fill();
  }
}
function drawProj(p){
  const cx = p.x + p.w/2, cy = p.y + p.h/2;
  if (p.kind === 'star'){
    for (let i=1;i<=3;i++){
      CX.globalAlpha = .2 / i;
      drawStarShape(cx - p.vx*i*1.7, cy, 7.6 - i, (p.spin||0) - i*.3, '#fffbcf', null);
    }
    CX.globalAlpha = 1;
    drawStarShape(cx, cy, 7.8, p.spin || 0, '#fff2a0');
    CX.fillStyle = '#ffffff'; ell(cx-1.8, cy-2.2, 1.6, 1.1, -.4); CX.fill();
  }
  else if (p.kind === 'puff'){
    const a = Math.max(0.12, p.life/16);
    CX.globalAlpha = a;
    circle(cx, cy, 5 + (16-p.life)*0.42); ink('#ffffff', 1.4);
    CX.globalAlpha = 1;
  }
  else if (p.kind === 'peel'){
    CX.save(); CX.translate(cx,cy); CX.rotate((p.spin = (p.spin||0) + 0.22));
    CX.beginPath(); CX.moveTo(-6.4,0); CX.quadraticCurveTo(0,7.4,6.4,0); CX.quadraticCurveTo(0,3,-6.4,0);
    CX.closePath(); ink('#ffe066', 1.4);
    CX.restore();
  }
}

/* ---------------- King Peela ---------------- */
function drawBoss(){
  if (!boss) return;
  const b = boss, cx = b.x + b.w/2, cy = b.y + b.h/2;
  CX.save();
  if (b.flash > 0 && Math.floor(game.t/2)%2 === 0) CX.globalAlpha = 0.5;
  if (b.state === 'dying'){ CX.translate(cx,cy); CX.rotate(Math.sin(game.t*0.4)*0.18); CX.translate(-cx,-cy); }

  CX.fillStyle = 'rgba(40,20,60,.2)'; ell(cx, b.y + b.h + 2, 18, 4); CX.fill();
  ell(cx - 11, b.y + b.h - 1, 8.4, 4.4); ink('#d94a2e', 2);
  ell(cx + 11, b.y + b.h - 1, 8.4, 4.4); ink('#f4663f', 2);
  ell(cx - 18, cy + 1, 5.8, 4.4, -0.4); ink('#8cb845', 2);
  ell(cx + 18, cy + 1, 5.8, 4.4,  0.4); ink('#8cb845', 2);

  ell(cx, cy, 18, 17); ink('#a8cf58', 2.2);
  CX.save(); ell(cx, cy, 18, 17); CX.clip();
  CX.fillStyle = '#7fae3c'; ell(cx + 6, cy + 8, 16, 10); CX.fill();
  CX.fillStyle = '#cbe98a'; ell(cx - 7, cy - 8, 6, 3.6, -.5); CX.fill();
  CX.restore();
  ell(cx, cy + 5.5, 11, 9); ink('#fff1c9', 1.6);

  // crown of bananas
  for (let i=-1;i<=1;i++){
    CX.save(); CX.translate(cx + i*8.5, b.y + 1.5); CX.rotate(i*0.5);
    CX.beginPath(); CX.moveTo(-3.8,4.5); CX.quadraticCurveTo(0,-9.5,3.8,4.5); CX.quadraticCurveTo(0,1,-3.8,4.5);
    CX.closePath(); ink('#ffd93b', 1.6);
    CX.restore();
  }
  rr(cx-10, b.y+3, 20, 4, 2); ink('#e0a600', 1.6);

  const d = b.dir;
  eye(cx - 5 + d*1.5, cy - 5, 2.2, 3.6);
  eye(cx + 5 + d*1.5, cy - 5, 2.2, 3.6);
  if (b.state === 'throw'){ ell(cx + d*2, cy + 3, 5.2, 4.6); ink('#7d2438', 1.5); }
  else {
    CX.strokeStyle='#7d2438'; CX.lineWidth=1.7; CX.lineCap='round';
    CX.beginPath(); CX.arc(cx + d*2, cy + 1, 4.8, 0.2, Math.PI-0.2); CX.stroke();
    CX.lineCap='butt';
  }
  blush(cx - 12, cy - 0.5, 3.2, 2.1); blush(cx + 12, cy - 0.5, 3.2, 2.1);
  CX.restore();

  // his health plate, under Kolby's
  const bw = 96, bx = (W - bw)/2 + cam.x, by = cam.y + 30;
  rr(bx-3, by-3, bw+6, 12, 6); CX.fillStyle='rgba(38,24,58,.85)'; CX.fill();
  CX.strokeStyle='rgba(255,246,216,.8)'; CX.lineWidth=1.4; CX.stroke();
  rr(bx, by, bw, 6, 3); CX.fillStyle = '#4a3a6a'; CX.fill();
  const f = Math.max(0, b.hp/b.maxhp);
  if (f > 0){ rr(bx, by, bw*f, 6, 3); CX.fillStyle = '#ff5c7a'; CX.fill();
    CX.fillStyle='rgba(255,255,255,.35)'; rr(bx+1, by+1, Math.max(0,bw*f-2), 2, 1); CX.fill(); }
}

function drawDoor(){
  if (!doorObj || !doorObj.open) return;
  const d = doorObj;
  const cx = d.x + d.w/2, cy = d.y + d.h/2 + Math.sin(d.t*0.06)*3;
  CX.globalAlpha = .3;
  drawStarShape(cx, cy, 19 + Math.sin(d.t*0.1)*2, d.t*0.02, '#fff6a8', null);
  CX.globalAlpha = 1;
  drawStarShape(cx, cy, 13, -d.t*0.03, '#ffe45c');
  CX.fillStyle = '#fffbe0'; ell(cx - 3, cy - 2.6, 2.4, 1.6, -.5); CX.fill();
  for (let i=0;i<4;i++){
    const a = d.t*0.04 + i*Math.PI/2;
    twinkle(cx + Math.cos(a)*17, cy + Math.sin(a)*17, 2.6 + Math.sin(d.t*0.15+i)*1, '#ffffff');
  }
}

/* ============================================================
   HUD + SCREENS
   ============================================================ */
function drawKolbyIcon(x,y,r){
  circle(x,y,r); ink('#ffd93b', 1.5);
  CX.save(); circle(x,y,r); CX.clip();
  CX.fillStyle='#fff29a'; ell(x-r*0.35,y-r*0.45,r*0.4,r*0.26,-.5); CX.fill();
  CX.restore();
  eye(x - r*0.3, y - r*0.12, r*0.19, r*0.38);
  eye(x + r*0.3, y - r*0.12, r*0.19, r*0.38);
  blush(x - r*0.66, y + r*0.28, r*0.22, r*0.15);
  blush(x + r*0.66, y + r*0.28, r*0.22, r*0.15);
}
/* how much puff is left, over Kolby's head while he floats on his own */
function drawPuffMeter(){
  if (pl.dead) return;
  const cx = pl.x + pl.w/2;
  if (pl.floating && !onWings() && pl.floatT > 0){
    const left = 1 - pl.floatT/FLOAT_MAX;
    rr(cx - 10, pl.y - 11, 20, 5, 2.5); CX.fillStyle = 'rgba(38,24,58,.75)'; CX.fill();
    rr(cx - 9, pl.y - 10, 18*left, 3, 1.5); CX.fillStyle = left < .3 ? '#ff8fb1' : '#fff6d8'; CX.fill();
  }
  if (pl.tired && !pl.onGround){            // out of puff: a little sweat drop
    CX.fillStyle = '#7ee0ff'; ell(cx - pl.dir*9, pl.y - 2, 1.5, 2.3); CX.fill();
  }
}
/* the spiky hat: a little dome with spikes on top, like the spiky guy's */
function spikyHat(x, y, resting){
  CX.fillStyle = resting ? '#b9b4cc' : '#f4f7ff'; CX.strokeStyle = OUT; CX.lineWidth = 1;
  for (let i=0;i<5;i++){
    const a = -Math.PI/2 + (i-2)*0.55, len = resting ? 7 : 9;
    CX.beginPath();
    CX.moveTo(x + Math.cos(a-0.3)*3.6, y - 1 + Math.sin(a-0.3)*3.6);
    CX.lineTo(x + Math.cos(a)*len, y - 1 + Math.sin(a)*len);
    CX.lineTo(x + Math.cos(a+0.3)*3.6, y - 1 + Math.sin(a+0.3)*3.6);
    CX.closePath(); CX.fill(); CX.stroke();
  }
  CX.beginPath(); CX.ellipse(x, y, 5.6, 4.6, 0, Math.PI, 0); CX.closePath(); ink('#5a5886', 1.2);
  CX.fillStyle = '#8583b3'; ell(x - 2, y - 2.4, 1.8, 1, -.4); CX.fill();
  rr(x - 6.6, y - 1, 13.2, 2.6, 1.3); ink('#8583b3', 1);
}
function drawSpikeIcon(x, y, resting){
  CX.fillStyle = resting ? '#b9b4cc' : '#dfe6f5'; CX.strokeStyle = OUT; CX.lineWidth = 1;
  for (let i=0;i<8;i++){
    const a = i/8*Math.PI*2;
    CX.beginPath();
    CX.moveTo(x + Math.cos(a-0.35)*3, y + Math.sin(a-0.35)*3);
    CX.lineTo(x + Math.cos(a)*7, y + Math.sin(a)*7);
    CX.lineTo(x + Math.cos(a+0.35)*3, y + Math.sin(a+0.35)*3);
    CX.closePath(); CX.fill(); CX.stroke();
  }
  circle(x, y, 3.6); ink('#4b4a6b', 1);
}
/* the power meter in the top bar: blue while it's usable, grey and counting down while it rests */
function powerMeter(icon, frac, resting, secs){
  const wx = 170, wy = 8, ww = 60;
  icon(wx - 8, 13.5, resting);
  rr(wx, wy, ww, 11, 5); CX.fillStyle = '#2a1b3d'; CX.fill();
  CX.strokeStyle = 'rgba(255,246,216,.5)'; CX.lineWidth = 1; CX.stroke();
  if (frac > 0){
    rr(wx, wy, Math.max(8, ww*frac), 11, 5); CX.fillStyle = resting ? '#8a7fa6' : '#7ee0ff'; CX.fill();
    if (!resting){ CX.fillStyle = 'rgba(255,255,255,.45)'; rr(wx + 2, wy + 1.5, Math.max(4, ww*frac - 4), 3, 1.5); CX.fill(); }
  }
  if (resting) txt(Math.ceil(secs) + 's', wx + ww/2, wy, '#fff6d8', 10, 'center');
}
function drawWingIcon(x, y, col){
  ell(x, y - 1.5, 6, 2.6, -0.7); ink(col, 1.2);
  ell(x + 2, y + 1.5, 5, 2.3, -0.2); ink(col, 1.2);
}

function drawHUD(){
  // plate
  rr(4, 3, W-8, 21, 9); CX.fillStyle = 'rgba(38,24,58,.8)'; CX.fill();
  CX.strokeStyle = 'rgba(255,246,216,.85)'; CX.lineWidth = 1.6; CX.stroke();

  drawKolbyIcon(18, 13.5, 7.5);
  txt('×' + game.lives, 29, 8, '#fff6d8', 12);

  // segmented health meter
  const hx = 56, hy = 8, seg = 13, gap = 2;
  rr(hx-3, hy-3, pl.maxhp*(seg+gap)+4, 17, 6); CX.fillStyle = '#2a1b3d'; CX.fill();
  CX.strokeStyle = 'rgba(255,246,216,.5)'; CX.lineWidth = 1; CX.stroke();
  for (let i=0;i<pl.maxhp;i++){
    const x = hx + i*(seg+gap);
    rr(x, hy, seg, 11, 3);
    CX.fillStyle = i < pl.hp ? '#ff5c7a' : '#4a3a6a'; CX.fill();
    if (i < pl.hp){ CX.fillStyle = 'rgba(255,255,255,.45)'; rr(x+1.5, hy+1.5, seg-3, 3, 1.5); CX.fill(); }
  }

  // your power: wings or a spiky hat
  if (pl.wings)
    powerMeter((x, y, r) => drawWingIcon(x, y, r ? '#cfc6e0' : '#ffffff'),
               pl.wingFuel / WING_MAX, pl.wingRest, (WING_MAX - pl.wingFuel)/60);
  else if (pl.spiky)
    powerMeter(drawSpikeIcon,
               pl.spikeT ? pl.spikeT / SPIKE_TIME : 1 - pl.spikeCool / SPIKE_REST,
               pl.spikeCool > 0 && !pl.spikeT, pl.spikeCool/60);

  drawBanana(W-104, 13, 1.15);
  txt('×' + game.bananas, W-96, 8, '#ffd93b', 12);
  txt(String(game.score).padStart(6,'0'), W - 12, 8, '#fff6d8', 12, 'right');

  if (game.banner > 0){
    const a = Math.min(1, game.banner/40);
    CX.globalAlpha = a;
    CX.font = 'bold 15px "Trebuchet MS", Verdana, sans-serif';
    const tw = CX.measureText(world.name).width + 60;
    rr((W-tw)/2, 86, tw, 30, 13); CX.fillStyle = 'rgba(38,24,58,.8)'; CX.fill();
    CX.strokeStyle = '#ffd93b'; CX.lineWidth = 2; CX.stroke();
    drawStarShape((W-tw)/2 + 18, 101, 7, game.t*0.04, '#ffe45c');
    drawStarShape((W+tw)/2 - 18, 101, 7, -game.t*0.04, '#ffe45c');
    txt(world.name, W/2, 93, '#fff6d8', 15, 'center');
    CX.globalAlpha = 1;
  }
  if (toastT > 0){
    CX.globalAlpha = Math.min(1, toastT/25);
    CX.font = 'bold 12px "Trebuchet MS", Verdana, sans-serif';
    const tw = CX.measureText(toastMsg).width + 24;
    rr((W-tw)/2, 122, tw, 21, 10); CX.fillStyle = 'rgba(38,24,58,.82)'; CX.fill();
    CX.strokeStyle = '#ffd93b'; CX.lineWidth = 1.6; CX.stroke();
    txt(toastMsg, W/2, 126, '#ffd93b', 12, 'center');
    CX.globalAlpha = 1;
    toastT--;
  }
}

function dim(a){ CX.fillStyle = 'rgba(30,18,48,' + a + ')'; CX.fillRect(0,0,W,H); }

function drawTitle(){
  const g = CX.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#7cc9f5'); g.addColorStop(.55,'#cbb6ff'); g.addColorStop(1,'#ffd0ea');
  CX.fillStyle = g; CX.fillRect(0,0,W,H);
  for (let i=0;i<16;i++){
    const sx = (i*61 + game.t*0.15) % W, sy = 14 + (i*37) % 80;
    CX.globalAlpha = .35 + .35*Math.sin(game.t*0.05 + i);
    twinkle(sx, sy, 2.6, '#ffffff'); CX.globalAlpha = 1;
  }
  for (let i=0;i<6;i++) puffCloud(((i*93 + game.t*0.2) % (W+120)) - 60, 30 + (i*29)%74, .8 + (i%2)*.25, .95);

  // green hill the hero stands on
  CX.fillStyle = '#57c23f';
  CX.beginPath(); CX.moveTo(-10,H); CX.lineTo(-10,188);
  for (let x=-10;x<=W+10;x+=16) CX.lineTo(x, 184 + Math.sin(x*0.028 + 1)*7);
  CX.lineTo(W+10,H); CX.closePath(); CX.fill();
  CX.fillStyle = '#83e35e';
  CX.beginPath(); CX.moveTo(-10,190);
  for (let x=-10;x<=W+10;x+=16) CX.lineTo(x, 184 + Math.sin(x*0.028 + 1)*7);
  CX.lineTo(W+10,196); CX.lineTo(-10,196); CX.closePath(); CX.fill();
  tree(44, 200); tree(356, 200);

  // big star behind the logo
  CX.globalAlpha = .55;
  drawStarShape(W/2, 60, 64 + Math.sin(game.t*0.04)*3, game.t*0.005, '#fff3b0', null);
  CX.globalAlpha = 1;

  bigtxt("NANA'S", W/2, 18, '#fff6d8', 27, 'center', 6);
  bigtxt('DREAMLAND', W/2, 44, '#ffd93b', 48, 'center', 8);

  // bouncing Kolby
  const kx = W/2, ky = 150 + Math.sin(game.t*0.09)*7;
  CX.fillStyle='rgba(40,20,60,.15)'; ell(kx, 172, 13, 3.2); CX.fill();
  ell(kx-7.6, ky+10, 5.6, 3.8, -.28); ink('#d94a2e', 1.7);
  ell(kx+7.6, ky+10, 5.6, 3.8,  .28); ink('#f4663f', 1.7);
  ell(kx-14.5, ky+1, 5.2, 3.9, -.45); ink('#ffcf2e', 1.6);
  ell(kx, ky, 13.5, 13.5); ink('#ffd93b', 2);
  CX.save(); ell(kx,ky,13.5,13.5); CX.clip();
  CX.fillStyle='#f0b400'; ell(kx+5, ky+8, 13, 8); CX.fill();
  CX.fillStyle='#fff29a'; ell(kx-5, ky-6, 5.4, 3.4, -.5); CX.fill();
  CX.restore();
  ell(kx+14.5, ky+2, 5.2, 3.9, .45); ink('#ffd93b', 1.6);
  eye(kx-3.9, ky-3.4, 2.2, 4.6); eye(kx+3.9, ky-3.4, 2.2, 4.6);
  blush(kx-8.4, ky+2.8, 2.8, 1.9); blush(kx+8.4, ky+2.8, 2.8, 1.9);
  CX.strokeStyle='#7d2438'; CX.lineWidth=1.6; CX.lineCap='round';
  CX.beginPath(); CX.arc(kx, ky+3, 3.4, 0.2, Math.PI-0.2); CX.stroke(); CX.lineCap='butt';

  if (Math.floor(game.t/24)%2 === 0)
    bigtxt(isTouch ? 'TAP TO START' : 'PRESS  Z  TO START', W/2, 198, '#fff6d8', 14, 'center', 4);
}

function drawOverlayScreens(){
  if (game.state === 'paused'){
    dim(.55);
    bigtxt('PAUSED', W/2, 86, '#ffd93b', 30, 'center', 6);
    txt('press P to keep dreaming', W/2, 126, '#fff6d8', 12, 'center');
  }
  if (game.state === 'clear'){
    dim(.4);
    for (let i=0;i<10;i++){
      const a = game.t*0.03 + i*0.63;
      twinkle(W/2 + Math.cos(a)*(50+i*7), 92 + Math.sin(a)*(28+i*3), 3 + (i%3), '#ffe45c');
    }
    bigtxt('LEVEL CLEAR!', W/2, 70, '#ffd93b', 28, 'center', 6);
    txt('bananas ' + game.bananas + '     score ' + game.score, W/2, 116, '#fff6d8', 13, 'center');
  }
  if (game.state === 'gameover'){
    dim(.68);
    bigtxt('GAME OVER', W/2, 68, '#ff8fb1', 32, 'center', 7);
    txt('final score ' + game.score, W/2, 116, '#fff6d8', 13, 'center');
    if (Math.floor(game.t/24)%2 === 0) txt('press Z to try again', W/2, 144, '#ffd93b', 12, 'center');
  }
  if (game.state === 'win'){
    const g = CX.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#ffe9a8'); g.addColorStop(1,'#ffb3d9');
    CX.fillStyle = g; CX.fillRect(0,0,W,H);
    for (let i=0;i<34;i++){
      const x = (i*97 + game.t*1.5) % W, y = (i*61 + game.t*2.2) % H;
      drawStarShape(x, y, 4 + (i%3), game.t*0.05 + i, '#fff6a8');
    }
    bigtxt('YOU DID IT!', W/2, 30, '#ffd93b', 32, 'center', 7);
    txt('Kolby peeled the king and saved', W/2, 84, '#5a3a1a', 13, 'center', false);
    txt('every last nana in Dreamland.', W/2, 102, '#5a3a1a', 13, 'center', false);
    bigtxt('bananas ' + game.bananas + '   score ' + game.score, W/2, 126, '#fff6d8', 15, 'center', 5);
    if (Math.floor(game.t/24)%2 === 0) txt('press Z for another dream', W/2, 168, '#5a3a1a', 12, 'center', false);
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
function togglePause(){
  if (game.state === 'play'){ game.state = 'paused'; }
  else if (game.state === 'paused'){ game.state = 'play'; nextNote = 0; }
}
function startGame(){
  game.lives = 5; game.score = 0; game.bananas = 0; game.level = 0;   // ten stages is a long trip
  pl.hp = pl.maxhp; pl.wings = false; pl.spiky = false;
  loadLevel(0);
  game.state = 'play';
  audioUnlock();
}
function nextLevel(){
  game.level++;
  if (game.level >= LEVELS.length){ game.state = 'win'; game.timer = 60; return; }
  pl.hp = Math.min(pl.maxhp, pl.hp + 2);
  loadLevel(game.level);
  game.state = 'play';
}
function respawn(){
  game.lives--;
  if (game.lives < 0){ game.state = 'gameover'; game.timer = 60; return; }
  pl.hp = pl.maxhp; pl.wings = false; pl.spiky = false;   // losing a life loses your power
  loadLevel(game.level);
  game.state = 'play';
}

function update(){
  game.t++;
  pollEdges();
  if (game.shake > 0) game.shake *= 0.86;

  switch (game.state){
    case 'title':
      if (P.start || P.jump || P.act){ P.start = 0; startGame(); }
      break;

    case 'play':
      updatePlayer();
      updateEnemies();
      updateProjs();
      checkEnemyProjs();
      updatePickups();
      updateBoss();
      updateDoor();
      updateParts();
      updateCamera(false);
      if (game.banner > 0) game.banner--;
      musicTick();
      break;

    case 'dead':
      pl.vy = Math.min(pl.vy + GRAV*0.7, MAXFALL);
      pl.y += pl.vy;
      updateParts();
      if (--game.timer <= 0) respawn();
      break;

    case 'clear':
      pl.y -= 1.4; pl.x += 0.3;
      if (game.t % 4 === 0) parts.push(spark(pl.x+7, pl.y+14, '#ffd93b'));
      updateParts(); updateCamera(false);
      if (--game.timer <= 0) nextLevel();
      break;

    case 'gameover':
    case 'win':
      updateParts();
      if (game.timer > 0) game.timer--;
      else if (P.start || P.jump || P.act){ P.start = 0; game.state = 'title'; }
      break;
  }
  P.start = 0;
}

function render(){
  if (game.state === 'title'){ drawTitle(); return; }

  CX.save();
  if (game.shake > 0.4)
    CX.translate((Math.random()-.5)*game.shake, (Math.random()-.5)*game.shake);

  drawSky();
  CX.save();
  CX.translate(-Math.round(cam.x), -Math.round(cam.y));

  drawTiles();
  drawDoor();
  for (const p of pickups) drawPickup(p);
  for (const e of enemies) drawEnemy(e);
  drawBoss();
  for (const p of projs) drawProj(p);

  if (game.state === 'dead'){
    CX.save();
    CX.translate(pl.x+7, pl.y+7); CX.rotate(game.t*0.25); CX.translate(-(pl.x+7),-(pl.y+7));
    drawKolby();
    CX.restore();
  } else drawKolby();
  drawPuffMeter();

  for (const p of parts){
    const a = Math.max(0, Math.min(1, p.life/18));
    CX.globalAlpha = a;
    if (p.kind === 'ring'){
      CX.strokeStyle = p.col; CX.lineWidth = 1.4;
      circle(p.x, p.y, (14 - p.life)*0.9 + 2); CX.stroke();
    } else if (p.kind === 'suck'){
      twinkle(p.x, p.y, 1.8, p.col);
    } else {
      twinkle(p.x, p.y, 1.2 + a*2.4, p.col);
    }
    CX.globalAlpha = 1;
  }
  for (const t of texts){
    CX.globalAlpha = Math.min(1, t.life/20);
    txt(t.s, t.x, t.y, t.col, 10);
    CX.globalAlpha = 1;
  }

  CX.restore();
  drawHUD();
  CX.restore();
  drawOverlayScreens();
}

let acc = 0, last = performance.now();
function frame(now){
  const dt = Math.min(100, now - last); last = now;
  acc += dt;
  let guard = 0;
  while (acc >= 16.667 && guard++ < 5){ update(); acc -= 16.667; }
  render();
  requestAnimationFrame(frame);
}

world = LEVELS[0]();       // so the title screen has something to reference
map = world.map; MAPH = map.length; MAPW = map[0].length;
fit();
requestAnimationFrame(frame);
</script>
