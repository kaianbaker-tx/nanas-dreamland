<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Nana's Dreamland</title>
<style>
  :root{
    --sky:#8fd8ff;
    --cream:#fff6d8;
    --peel:#ffd93b;
    --ink:#241a3a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;
    background:#150f24;
    font-family:"Trebuchet MS",Verdana,sans-serif;
    color:var(--cream);
    touch-action:none;
    user-select:none;
  }
  #wrap{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 25%, #3a2a5e, #120c1f 75%);
  }
  #stage{position:relative;line-height:0}
  canvas{
    display:block;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    border:6px solid #2c2050;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.65), 0 0 0 3px #ffd93b44;
    background:#8fd8ff;
  }
  /* ---- touch controls ---- */
  #touch{position:fixed;inset:0;display:none;pointer-events:none;z-index:5}
  #touch.on{display:block}
  .tb{
    position:absolute;pointer-events:auto;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,246,216,.16);
    border:3px solid rgba(255,246,216,.45);
    border-radius:50%;
    color:#fff6d8;font-size:20px;font-weight:bold;
    width:74px;height:74px;
  }
  .tb.press{background:rgba(255,217,59,.45)}
  #tl{left:16px;bottom:104px}
  #tr{left:104px;bottom:104px}
  #td{left:60px;bottom:26px}
  #tj{right:112px;bottom:40px;width:86px;height:86px;background:rgba(120,220,140,.22)}
  #tk{right:16px;bottom:104px;width:86px;height:86px;background:rgba(255,140,160,.22)}
  #hint{
    position:fixed;left:0;right:0;bottom:6px;text-align:center;
    font-size:12px;letter-spacing:.06em;color:#fff6d888;z-index:4;
  }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="400" height="224"></canvas></div></div>
<div id="touch">
  <div class="tb" id="tl">&#9664;</div>
  <div class="tb" id="tr">&#9654;</div>
  <div class="tb" id="td">&#9660;</div>
  <div class="tb" id="tj">FLY</div>
  <div class="tb" id="tk">SUCK</div>
</div>
<div id="hint">&#8592;&#8594; move &nbsp;|&nbsp; Z / Up = jump &amp; float &nbsp;|&nbsp; X = inhale, spit &nbsp;|&nbsp; Down = swallow (flyer = WINGS, spiky guy = SPIKY HAT) &nbsp;|&nbsp; P pause &nbsp;|&nbsp; M mute</div>
<script>
"use strict";
/* ============================================================
   NANA'S DREAMLAND
   A floaty little platformer. Kolby is yellow. Kolby eats things.
   ============================================================ */

const CV = document.getElementById('c');
const CX = CV.getContext('2d');
CX.imageSmoothingEnabled = false;

const W = 400, H = 224, TS = 16;
const COLS = W / TS, ROWS = H / TS;   // 25 x 14

/* ---------- fit the canvas to the window ---------- */
function fit(){
  const pad = 26;
  const aw = window.innerWidth - pad*2;
  const ah = window.innerHeight - pad*2 - (isTouch ? 120 : 30);
  let s = Math.min(aw / W, ah / H);
  s = Math.max(1, Math.floor(s * 2) / 2);   // half-step scaling keeps pixels crisp-ish
  CV.style.width  = (W * s) + 'px';
  CV.style.height = (H * s) + 'px';
}
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) document.getElementById('touch').classList.add('on');
window.addEventListener('resize', fit);

/* ---------- input ---------- */
const K = { left:0, right:0, up:0, down:0, jump:0, act:0 };
const P = { jump:0, act:0, up:0, down:0, start:0 };   // pressed-this-frame edges
let jumpHeld = false, actHeld = false, upHeld = false, downHeld = false;

const KEYMAP = {
  ArrowLeft:'left', KeyA:'left',
  ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up',
  ArrowDown:'down', KeyS:'down',
  KeyZ:'jump', Space:'jump',
  KeyX:'act', KeyK:'act', KeyJ:'act'
};

addEventListener('keydown', e => {
  const m = KEYMAP[e.code];
  if (m){ e.preventDefault(); K[m] = 1; }
  if (e.code === 'ArrowUp' || e.code === 'KeyW') K.jump = 1;
  if (e.code === 'Enter' || e.code === 'Space') P.start = 1;
  if (e.code === 'KeyP') togglePause();
  if (e.code === 'KeyM') toggleMute();
  if (e.code === 'KeyR' && (game.state==='play'||game.state==='dead')) killPlayer(true);
  audioUnlock();
});
addEventListener('keyup', e => {
  const m = KEYMAP[e.code];
  if (m) K[m] = 0;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') K.jump = 0;
});

function bindTouch(id, key){
  const el = document.getElementById(id);
  const on  = e => { e.preventDefault(); K[key] = 1; if(key==='act'||key==='jump') P.start=1; el.classList.add('press'); audioUnlock(); };
  const off = e => { e.preventDefault(); K[key] = 0; el.classList.remove('press'); };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on);
  addEventListener('mouseup', off);
}
bindTouch('tl','left'); bindTouch('tr','right'); bindTouch('td','down');
bindTouch('tj','jump'); bindTouch('tk','act');
CV.addEventListener('pointerdown', () => { P.start = 1; audioUnlock(); });

function pollEdges(){
  P.jump = (K.jump && !jumpHeld) ? 1 : 0; jumpHeld = !!K.jump;
  P.act  = (K.act  && !actHeld)  ? 1 : 0; actHeld  = !!K.act;
  P.up   = (K.up   && !upHeld)   ? 1 : 0; upHeld   = !!K.up;
  P.down = (K.down && !downHeld) ? 1 : 0; downHeld = !!K.down;
}

/* ============================================================
   SOUND — tiny chiptune-ish blips + a looping melody
   ============================================================ */
let AC = null, muted = false, masterGain = null;
function audioUnlock(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain();
    masterGain.gain.value = 0.34;
    masterGain.connect(AC.destination);
  } catch(e){ AC = null; }
}
function toggleMute(){
  muted = !muted;
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.34;
  toast(muted ? 'sound off' : 'sound on');
}
function blip(freq, dur, type, vol, slideTo){
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  const t = AC.currentTime;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol){
  if (!AC || muted) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = AC.createBufferSource(); s.buffer = buf;
  const g = AC.createGain(); g.gain.value = vol || 0.18;
  s.connect(g); g.connect(masterGain); s.start();
}
const SFX = {
  jump:  () => blip(430, .13, 'square', .18, 760),
  flap:  () => blip(620, .09, 'triangle', .13, 880),
  inhale:() => blip(180, .07, 'sawtooth', .07, 260),
  spit:  () => blip(700, .14, 'square', .22, 220),
  eat:   () => blip(300, .10, 'triangle', .22, 560),
  pick:  () => { blip(880, .07, 'square', .18); setTimeout(()=>blip(1320,.09,'square',.16),60); },
  hurt:  () => blip(320, .22, 'sawtooth', .22, 90),
  die:   () => { blip(500,.5,'square',.22,80); noise(.4,.12); },
  boom:  () => { noise(.22,.22); blip(140,.2,'square',.16,60); },
  clear: () => [0,1,2,3].forEach(i => setTimeout(()=>blip([523,659,784,1047][i], .18,'square',.2), i*110)),
  bosshit:()=> { blip(200,.16,'sawtooth',.2,420); noise(.1,.14); },
  tired: () => blip(560, .3, 'triangle', .16, 180),
  spikes:() => { blip(900, .08, 'square', .16, 1500); noise(.08, .1); }
};

/* melody: [semitone-from-C4 or null, beats] */
const SONGS = {
  field: [[7,1],[9,1],[12,2],[9,1],[7,1],[5,2],[7,1],[9,1],[11,1],[12,1],[14,2],[12,2],
          [7,1],[9,1],[12,2],[16,1],[14,1],[12,2],[11,1],[9,1],[7,1],[5,1],[7,4]],
  sky:   [[12,1],[11,1],[9,1],[7,1],[9,2],[12,2],[14,1],[12,1],[11,1],[9,1],[7,2],[4,2],
          [5,1],[7,1],[9,2],[11,1],[12,1],[16,2],[14,4]],
  boss:  [[0,1],[0,1],[3,1],[0,1],[5,1],[0,1],[3,1],[-1,1],[0,1],[0,1],[3,1],[7,1],[6,2],[3,2]],
  cave:  [[0,2],[3,1],[7,1],[10,2],[7,1],[3,1],[5,2],[8,1],[5,1],[3,2],[2,1],[0,1],[-2,2],[0,4]],
  summit:[[12,1],[14,1],[16,1],[19,2],[16,1],[14,1],[12,2],[9,1],[11,1],[12,2],[16,1],[14,1],
          [12,1],[11,1],[9,2],[7,1],[9,1],[11,1],[12,4]],
  grove: [[7,1],[11,1],[14,1],[12,2],[11,1],[9,2],[7,1],[4,2],[5,1],[7,1],[9,1],[11,2],[9,1],[7,3],
          [7,1],[11,1],[14,1],[16,2],[14,1],[12,2],[11,1],[9,1],[11,1],[12,1],[9,2],[7,4]],
  beach: [[0,1],[4,.5],[7,.5],[12,1],[7,1],[9,1],[7,.5],[4,.5],[5,2],[4,1],[5,.5],[7,.5],[9,1],[11,1],
          [12,2],[null,1],[12,1],[11,.5],[9,.5],[7,1],[4,1],[5,1],[7,1],[4,2],[2,1],[0,3]],
  jungle:[[9,1],[12,1],[9,.5],[7,.5],[4,1],[7,2],[9,1],[4,1],[2,1],[0,1],[2,2],[null,1],
          [9,1],[12,1],[14,1],[12,.5],[9,.5],[7,2],[4,1],[7,1],[9,4]],
  night: [[5,2],[9,1],[12,3],[10,1],[9,2],[7,1],[5,3],[7,2],[9,1],[10,2],[9,1],[7,2],[5,1],[4,3],
          [5,2],[9,1],[12,3],[14,1],[12,2],[10,1],[9,2],[7,1],[5,5]]
};
let song = SONGS.field, songI = 0, nextNote = 0, bpm = 138;
function setSong(name){ if (SONGS[name] && song !== SONGS[name]){ song = SONGS[name]; songI = 0; nextNote = 0; } }
function musicTick(){
  if (!AC || muted || game.state !== 'play') return;
  const t = AC.currentTime;
  if (nextNote === 0) nextNote = t + .05;
  const beat = 60 / bpm;
  while (nextNote < t + 0.25){
    const [n, len] = song[songI % song.length];
    const dur = len * beat;
    if (n !== null){
      const f = 261.63 * Math.pow(2, n/12);
      // lead
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, nextNote);
      g.gain.exponentialRampToValueAtTime(.075, nextNote + .02);
      g.gain.exponentialRampToValueAtTime(.0001, nextNote + dur*.9);
      o.connect(g); g.connect(masterGain); o.start(nextNote); o.stop(nextNote + dur);
      // bass
      const b = AC.createOscillator(), bg = AC.createGain();
      b.type = 'triangle'; b.frequency.value = f/4;
      bg.gain.setValueAtTime(0.0001, nextNote);
      bg.gain.exponentialRampToValueAtTime(.09, nextNote + .02);
      bg.gain.exponentialRampToValueAtTime(.0001, nextNote + dur*.8);
      b.connect(bg); bg.connect(masterGain); b.start(nextNote); b.stop(nextNote + dur);
    }
    nextNote += dur;
    songI++;
  }
}

/* ============================================================
   LEVEL BUILDING
   tiles: '.' air  '#' dirt  'X' brick(breakable)  '^' spikes
   spawns are stripped out of the map at load time
   ============================================================ */
function mkMap(w, h){
  const m = [];
  for (let y=0;y<h;y++) m.push(new Array(w).fill('.'));
  return m;
}
function rect(m,x,y,w,h,ch){
  for (let j=y;j<y+h;j++) for (let i=x;i<x+w;i++)
    if (m[j] && i>=0 && i<m[0].length) m[j][i] = ch;
}
function ground(m,x,w,top){ rect(m, x, top, w, m.length-top, '#'); }

function level1(){
  const w = 116, h = 14, m = mkMap(w,h);
  const spawns = [];
  const T = 11;                       // ground surface row
  ground(m, 0, 26, T);
  ground(m, 30, 18, T);
  ground(m, 51, 13, T-1);
  ground(m, 67, 20, T);
  ground(m, 91, 25, T);

  // rolling bumps
  rect(m, 8, T-1, 4, 1, '#');
  rect(m, 20, T-2, 3, 2, '#');
  rect(m, 74, T-1, 6, 1, '#');
  rect(m, 100, T-2, 5, 2, '#');

  // floating brick runs + platforms
  rect(m, 14, 7, 5, 1, 'X');
  rect(m, 36, 6, 4, 1, 'X');
  rect(m, 44, 8, 3, 1, '#');
  rect(m, 57, 6, 5, 1, 'X');
  rect(m, 70, 5, 4, 1, '#');
  rect(m, 82, 7, 4, 1, 'X');
  rect(m, 95, 5, 5, 1, '#');
  rect(m, 105, 7, 4, 1, 'X');

  // a couple of spike patches to respect
  rect(m, 45, T-1, 3, 1, '^');
  rect(m, 81, T-1, 2, 1, "^");

  spawns.push(['player', 3, T-1]);
  [['walker',10,T-2],['walker',22,T-3],['flyer',17,6],['walker',34,T-1],
   ['flyer',41,5],['spiky',53,T-2],['walker',59,T-2],['flyer',65,7],
   ['walker',72,T-1],['walker',78,T-2],['spiky',84,T-1],['flyer',90,6],
   ['walker',97,T-1],['walker',108,T-1],['flyer',103,4]].forEach(s=>spawns.push(s));

  [[15,6],[16,6],[17,6],[37,5],[38,5],[58,5],[59,5],[60,5],[71,4],[72,4],
   [83,6],[84,6],[96,4],[97,4],[98,4],[106,6],[107,6],[24,T-1],[47,7],[80,T-2]]
    .forEach(([x,y]) => spawns.push(['banana',x,y]));
  spawns.push(['heart', 62, 5]);
  spawns.push(['door', 112, T-2]);
  return { map:m, spawns, name:'NANA FIELDS', back:'grass', pal:PAL_GRASS, song:'field', sky:['#8fd8ff','#d9f4ff'], boss:false };
}

function level2(){
  const w = 120, h = 14, m = mkMap(w,h);
  const spawns = [];
  const T = 12;
  ground(m, 0, 14, T);
  // sky islands
  const isl = [[18,9,5],[26,7,4],[34,10,6],[44,8,4],[52,5,4],[59,9,5],[68,6,4],
               [76,10,5],[85,7,6],[95,9,4],[102,6,5],[110,10,10]];
  isl.forEach(([x,y,ww]) => { rect(m, x, y, ww, 1, '#'); if (ww>4) rect(m, x+1, y+1, ww-2, 1, '#'); });
  rect(m, 30, 4, 3, 1, 'X');
  rect(m, 63, 4, 4, 1, 'X');
  rect(m, 90, 3, 4, 1, 'X');
  rect(m, 8, T-1, 4, 1, 'X');

  spawns.push(['player', 3, T-1]);
  [['flyer',20,6],['walker',19,8],['flyer',30,7],['walker',35,9],['spiky',37,9],
   ['flyer',46,5],['walker',53,4],['flyer',57,8],['walker',60,8],['flyer',67,3],
   ['spiky',77,9],['walker',86,6],['flyer',88,3],['walker',96,8],['flyer',99,6],
   ['walker',103,5],['flyer',107,4],['walker',112,9],['walker',115,9]].forEach(s=>spawns.push(s));

  [[19,8],[20,8],[27,6],[28,6],[35,9],[36,9],[45,7],[53,4],[54,4],[60,8],[61,8],
   [69,5],[70,5],[77,9],[86,6],[87,6],[96,8],[103,5],[104,5],[111,9],[31,3],[64,3],[91,2]]
    .forEach(([x,y]) => spawns.push(['banana',x,y]));
  spawns.push(['heart', 44, 7]);
  spawns.push(['life', 92, 2]);
  spawns.push(['door', 116, 8]);   // sits on the last sky island (surface row 10)
  return { map:m, spawns, name:'CLOUD CUSTARD', back:'custard', pal:PAL_CUSTARD, song:'sky', sky:['#b79bff','#ffd2f0'], boss:false };
}

function level3(){
  const w = 40, h = 14, m = mkMap(w,h);
  const spawns = [];
  const T = 11;
  ground(m, 0, w, T);
  rect(m, 2, 6, 3, 1, '#');
  rect(m, 35, 6, 3, 1, '#');
  rect(m, 12, 4, 4, 1, 'X');
  rect(m, 24, 4, 4, 1, 'X');
  spawns.push(['player', 4, T-1]);
  spawns.push(['boss', 30, T-3]);
  spawns.push(['door', 19, T-2]);
  return { map:m, spawns, name:'KING PEELA', back:'castle', pal:PAL_CASTLE, song:'boss', sky:['#5b3f8c','#ff9bd2'], boss:true };
}

/* palettes: g/gl/gd = surface cap, d/dd/dl = the soil under it.
   cap = what sits on top (grass, drip, puff, sand, leaf), tex = what the soil is made of,
   out = the ink around the ground, spk/spkb = spike colors */
const PAL_GRASS = { g:'#5cc73f', gl:'#83e35e', d:'#c2803f', dd:'#a3652c', dl:'#d99a58' };
const PAL_CAVE  = { g:'#f2cf3a', gl:'#fff29a', d:'#6b5a7d', dd:'#51436a', dl:'#8a76a6', spots:true };  // peel draped over rock
const PAL_CASTLE= { g:'#a97be0', gl:'#c9a4f5', d:'#c2803f', dd:'#a3652c', dl:'#d99a58' };
const PAL_SYRUP = { cap:'drip', tex:'pancake', g:'#a8500f', gl:'#e98b2e', gd:'#6e3208',
                    d:'#f7cb85', dd:'#d99a4a', dl:'#ffe2ae', butter:true };
const PAL_CUSTARD={ cap:'puff', tex:'custard', out:'#7c5f96', g:'#ffffff', gl:'#ffffff', gd:'#d9d2ff',
                    d:'#ffe08a', dd:'#d9953c', dl:'#fff2bf' };
const PAL_SUGAR = { cap:'drip', tex:'sugar', out:'#7a6aa8', g:'#ffd6ea', gl:'#ffffff', gd:'#f29ac4',
                    d:'#f7f4ff', dd:'#cfc8ee', dl:'#ffffff', spk:'#bfe8ff', spkb:'#9a8fd0' };
const PAL_CANDY = { cap:'drip', tex:'choc', out:'#2e1610', g:'#ff8fc4', gl:'#ffc4e1', gd:'#d95c97',
                    d:'#7a4630', dd:'#553020', dl:'#9c6246', sprinkles:true, spk:'#fff6d8', spkb:'#ff5c7a' };
const PAL_SAND  = { cap:'sand', tex:'sand', out:'#7a5530', g:'#ffe3a0', gl:'#fff5d6', gd:'#e2b96a',
                    d:'#f0c97a', dd:'#d6a458', dl:'#fbe0a8', spk:'#9a6ad0', spkb:'#6b4a9e' };
const PAL_JUNGLE= { cap:'leaf', tex:'soil', out:'#2a2418', g:'#2f9e44', gl:'#5fd35c', gd:'#1f7a33',
                    d:'#6b4a2e', dd:'#4f3420', dl:'#8a6440', spk:'#d8f07a', spkb:'#4f3420' };
const PAL_NIGHT = { cap:'puff', tex:'night', out:'#1a1238', g:'#c9b8ff', gl:'#efe6ff', gd:'#9a86e0',
                    d:'#3d3480', dd:'#2c2566', dl:'#5a4fa8' };

function ceiling(m,x,w,rows){ rect(m, x, 0, w, rows, '#'); }

/* ---------------- SYRUP GROVE ---------------- */
function levelGrove(){
  const w = 124, h = 14, m = mkMap(w,h);
  const spawns = [];
  const T = 11;
  ground(m,   0, 20, T);
  ground(m,  24, 14, T);
  ground(m,  42, 22, T-1);      // raised shelf
  ground(m,  68, 16, T);
  ground(m,  88, 12, T-2);      // higher shelf
  ground(m, 104, 20, T);

  rect(m, 10, T-1, 3, 1, '#');
  rect(m, 72, T-1, 4, 1, '#');
  rect(m, 33, T-1, 2, 1, '^');
  rect(m, 78, T-1, 2, 1, '^');

  rect(m, 15, 7, 4, 1, 'X');
  rect(m, 28, 7, 4, 1, '#');
  rect(m, 45, 5, 4, 1, '#');
  rect(m, 52, 6, 1, 4, 'X');    // stack you smash or float over
  rect(m, 78, 6, 5, 1, 'X');
  rect(m, 92, 5, 4, 1, '#');
  rect(m, 110, 7, 3, 1, 'X');
  rect(m, 116, 5, 4, 1, '#');

  spawns.push(['player', 3, T-1]);
  [['walker',8,T-1],['flyer',17,6],['walker',26,T-1],['walker',30,6],['spiky',36,T-1],
   ['walker',46,T-2],['flyer',49,4],['walker',56,T-2],['walker',60,T-2],['flyer',65,6],
   ['walker',70,T-1],['spiky',81,T-1],['flyer',85,5],['walker',90,T-3],['walker',96,T-3],

                levelJungle, levelCatacomb, levelNight, level3];

/* ============================================================
   WORLD STATE
   ============================================================ */
const game = {
  state: 'title',      // title | play | paused | dead | clear | gameover | win
  level: 0,
  lives: 3,
  score: 0,
  bananas: 0,
  timer: 0,
  banner: 0,
  bannerText: '',
  shake: 0,
  t: 0
};
let map = [], MAPW = 0, MAPH = 0, world = null;
let enemies = [], projs = [], pickups = [], parts = [], texts = [];
let boss = null, doorObj = null;
const cam = { x:0, y:0 };
let toastMsg = '', toastT = 0;
function toast(s, dur){ toastMsg = s; toastT = dur || 90; }

const pl = {
  x:0, y:0, w:14, h:14, vx:0, vy:0, dir:1,
  onGround:false, floating:false, inhaling:0, mouthful:null,
  hp:6, maxhp:6, inv:0, anim:0, walkT:0, puffT:0, hurtT:0, squish:0, dead:false,
  floatT:0, tired:false, wings:false, wingFuel:0, wingRest:false,
  spiky:false, spikeT:0, spikeCool:0, spikeHitBoss:false
};

function tileAt(tx,ty){
  if (ty < 0) return '.';
  if (tx < 0 || tx >= MAPW || ty >= MAPH) return (ty >= MAPH) ? '.' : '#';
  return map[ty][tx];
}
function solidPx(px,py){
  const c = tileAt(Math.floor(px/TS), Math.floor(py/TS));
  return c === '#' || c === 'X';
}
function hazardPx(px,py){
  return tileAt(Math.floor(px/TS), Math.floor(py/TS)) === '^';
}
function boxSolid(x,y,w,h){
  const x0 = Math.floor(x/TS), x1 = Math.floor((x+w-1)/TS);
  const y0 = Math.floor(y/TS), y1 = Math.floor((y+h-1)/TS);
  for (let ty=y0; ty<=y1; ty++) for (let tx=x0; tx<=x1; tx++){
    const c = tileAt(tx,ty);
    if (c === '#' || c === 'X') return true;
  }
  return false;
}
function boxHazard(x,y,w,h){
  const x0 = Math.floor(x/TS), x1 = Math.floor((x+w-1)/TS);
  const y0 = Math.floor(y/TS), y1 = Math.floor((y+h-1)/TS);
  for (let ty=y0; ty<=y1; ty++) for (let tx=x0; tx<=x1; tx++)
    if (tileAt(tx,ty) === '^') return true;
  return false;
}
function hit(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

/* generic "move with tile collision" for any box entity */
function moveBox(e, dx, dy){
  let hitX = false, hitY = false;
  let steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 4) || 1;
  const sx = dx/steps, sy = dy/steps;
  for (let s=0; s<steps; s++){
    if (sx){
      e.x += sx;
      if (boxSolid(e.x, e.y, e.w, e.h)){
        e.x -= sx;
        e.x = sx > 0 ? Math.floor((e.x + e.w)/TS)*TS - e.w - 0.01
                     : Math.floor(e.x/TS)*TS + TS + 0.01;
        hitX = true;
      }
    }
    if (sy){
      e.y += sy;
      if (boxSolid(e.x, e.y, e.w, e.h)){
        e.y -= sy;
        e.y = sy > 0 ? Math.floor((e.y + e.h)/TS)*TS - e.h - 0.01
                     : Math.floor(e.y/TS)*TS + TS + 0.01;
        hitY = true;
      }
    }
  }
  return { hitX, hitY };
}

/* ---------- entity factories ---------- */
function mkEnemy(type, tx, ty){
  const base = { type, state:'live', t: Math.random()*100, dir: -1, vx:0, vy:0, hp:1, stun:0 };
  if (type === 'walker'){ Object.assign(base, {w:14,h:13, spd:.42}); }
  if (type === 'flyer') { Object.assign(base, {w:15,h:12, spd:.42, homeY:0}); }
  if (type === 'spiky') { Object.assign(base, {w:14,h:14, spd:.32, heavy:true}); }
  base.x = tx*TS + (TS - base.w)/2;
  base.y = (ty+1)*TS - base.h;
  if (type === 'flyer') base.homeY = base.y;
  return base;
}
function mkPickup(kind, tx, ty){
  const w = kind==='life' ? 14 : 12, h = kind==='life' ? 14 : 12;
  return { kind, x: tx*TS + (TS-w)/2, y: (ty+1)*TS - h - 2, w, h, t: Math.random()*100, vx:0, vy:0, life:0 };
}
function mkStar(x,y,vx){
  return { kind:'star', x, y, w:12, h:12, vx, vy:-2, t:0, life:1200, phys:true };
}

function loadLevel(i){
  world = LEVELS[i]();
  world.name = '1-' + (i+1) + '  ' + world.name;
  map = world.map; MAPH = map.length; MAPW = map[0].length;
  enemies = []; projs = []; pickups = []; parts = []; texts = [];
  boss = null; doorObj = null;
  for (const [kind, tx, ty] of world.spawns){
    if (kind === 'player'){
      pl.x = tx*TS + 1; pl.y = (ty+1)*TS - pl.h;
      pl.vx = pl.vy = 0; pl.dir = 1; pl.floating = false;
      pl.inhaling = 0; pl.mouthful = null; pl.inv = 90; pl.dead = false;
      pl.floatT = 0; pl.tired = false;
      if (pl.wings){ pl.wingFuel = WING_MAX; pl.wingRest = false; }
      pl.spikeT = 0; pl.spikeCool = 0;
    }
    else if (kind === 'walker' || kind === 'flyer' || kind === 'spiky') enemies.push(mkEnemy(kind,tx,ty));
    else if (kind === 'banana' || kind === 'heart' || kind === 'life') pickups.push(mkPickup(kind,tx,ty));
    else if (kind === 'door') doorObj = { x:tx*TS, y:(ty)*TS, w:24, h:32, open: !world.boss, t:0 };
    else if (kind === 'boss') boss = mkBoss(tx,ty);
  }
  cam.x = 0; cam.y = 0;
  updateCamera(true);
  game.banner = 150; game.bannerText = world.name; toastT = 0;
  setSong(world.song);
  bpm = world.bpm || (world.boss ? 158 : 138);
  if (world.boss) toast('SUCK UP his stars  \u2014  then SPIT them at the king!', 420);
}

function mkBoss(tx,ty){
  return {
    x: tx*TS, y: (ty+1)*TS - 34, w:36, h:34,
    vx:0, vy:0, hp:8, maxhp:8, dir:-1,
    state:'wait', t:60, hops:0, flash:0, dead:0, onGround:false, puff:0
  };
}

   ============================================================ */
const GRAV = 0.40, MAXFALL = 6.2;
const F_GRAV = 0.13, F_MAXFALL = 1.05;
const FLOAT_MAX = 120;    // Kolby can puff and float on his own for 2 s, then he has to land
const WING_MAX  = 600;    // wings from a swallowed flyer: 10 s of flying, then 10 s to rest
const SPIKE_TIME = 60;    // spiky hat from a swallowed spiky guy: spikes stay out 1 s...
const SPIKE_REST = 180;   // ...then rest 3 s before you can pop them again
const SPIKE_R = 22;       // how close an enemy has to be for the spikes to pop it

/* one power at a time: getting a new one swaps out the old one */
function onWings(){ return pl.wings && !pl.wingRest && pl.wingFuel > 0; }
function giveWings(){
  toast(pl.wings ? 'wings full again!' : 'WINGS!  fly for 10 seconds', 200);
  pl.wings = true; pl.wingFuel = WING_MAX; pl.wingRest = false;
  pl.spiky = false; pl.spikeT = 0;
  SFX.clear();
}
function giveSpikes(){
  toast(pl.spiky ? 'spikes ready!' : 'SPIKY HAT!  press DOWN for spikes', 200);
  pl.spiky = true; pl.spikeT = 0; pl.spikeCool = 0;
  pl.wings = false;
  SFX.clear();
}
/* spikes out: pop enemies, peels and star blocks that are close, and poke the king once */
function spikeAttack(){
  const cx = pl.x + pl.w/2, cy = pl.y + pl.h/2;
  for (const e of enemies){
    if (e.state === 'gone') continue;
    if (Math.hypot(e.x + e.w/2 - cx, e.y + e.h/2 - cy) < SPIKE_R) killEnemy(e);
  }
  for (const p of projs)
    if (p.enemy && Math.hypot(p.x + p.w/2 - cx, p.y + p.h/2 - cy) < SPIKE_R){ p.life = 0; poof(p.x+6, p.y+5, '#ffe066', 6); }
  for (let ty = Math.floor((cy-SPIKE_R)/TS); ty <= Math.floor((cy+SPIKE_R)/TS); ty++)
    for (let tx = Math.floor((cx-SPIKE_R)/TS); tx <= Math.floor((cx+SPIKE_R)/TS); tx++)
      if (tileAt(tx,ty) === 'X' && Math.hypot(tx*TS+8 - cx, ty*TS+8 - cy) < SPIKE_R + 4){
        map[ty][tx] = '.'; poof(tx*TS+8, ty*TS+8, '#e8a05a', 12); game.score += 20; SFX.boom();
      }
  if (boss && boss.dead === 0 && !pl.spikeHitBoss &&
      hit({ x: pl.x - 8, y: pl.y - 8, w: pl.w + 16, h: pl.h + 16 }, boss)){
    pl.spikeHitBoss = true;
    hurtBoss({ vx: boss.x + boss.w/2 > cx ? 1 : -1, life: 1 });
  }
}
/* out of puff: stop floating and fall until you land */
function dropDown(msg){
  pl.floating = false; pl.tired = true;
  SFX.tired(); puffRing(pl.x+7, pl.y+4);
  if (msg) toast(msg, 150);
}

function updatePlayer(){
  if (pl.hurtT > 0) pl.hurtT--;
  if (pl.inv > 0) pl.inv--;
  if (pl.puffT > 0) pl.puffT--;
  if (pl.squish > 0) pl.squish -= 0.06;

  const stunned = pl.hurtT > 0;
  const canAct = !stunned;

  /* ---- horizontal ---- */
  let accel = 0.5, maxS = 2.05;
  if (pl.inhaling){ accel = 0.22; maxS = 0.85; }
  if (pl.floating){ accel = 0.35; maxS = onWings() ? 2.05 : 1.65; }
  if (pl.spikeT > 0){ accel = 0.25; maxS = 0.8; }
  if (canAct){
    if (K.left && !K.right){ pl.vx -= accel; pl.dir = -1; }
    else if (K.right && !K.left){ pl.vx += accel; pl.dir = 1; }
    else pl.vx *= pl.onGround ? 0.74 : 0.90;
  } else pl.vx *= 0.94;
  pl.vx = Math.max(-maxS, Math.min(maxS, pl.vx));
  if (Math.abs(pl.vx) < 0.04) pl.vx = 0;

  /* ---- jump / float ---- */
  if (canAct && P.jump && !pl.inhaling && !pl.mouthful){
    if (pl.onGround){
      pl.vy = -5.5; pl.onGround = false; pl.squish = 0.5; SFX.jump();
    } else if (!pl.floating){
      if (!pl.tired && !pl.spikeT){ pl.floating = true; pl.vy = Math.min(pl.vy, 0) - 1.7; SFX.flap(); puffRing(pl.x+7, pl.y+14); }
    } else {
      pl.vy = onWings() ? -2.2 : -1.75; SFX.flap(); puffRing(pl.x+7, pl.y+14);
    }
  }
  if (canAct && P.jump && pl.mouthful && pl.onGround){ pl.vy = -4.4; pl.onGround = false; SFX.jump(); }
  // short hop
  if (!K.jump && !pl.floating && pl.vy < -2.2) pl.vy = -2.2;
  if (pl.floating && (K.down || pl.mouthful)) pl.floating = false;

  /* ---- floating runs out: 2.5 s of puff on your own, or 10 s on wings ---- */
  if (pl.floating){
    if (onWings()){
      if (--pl.wingFuel <= 0){ pl.wingRest = true; dropDown('wings are tired!  10 seconds to rest'); }
    } else if (++pl.floatT >= FLOAT_MAX) dropDown();
  } else if (pl.wings && pl.wingFuel < WING_MAX){
    pl.wingFuel++;
    if (pl.wingFuel >= WING_MAX && pl.wingRest){ pl.wingRest = false; toast('wings ready!'); SFX.flap(); }
  }

  /* ---- inhale / spit / swallow ---- */
  if (canAct && !pl.floating && !pl.mouthful && K.act){
    pl.inhaling++;
    if (pl.inhaling % 7 === 1) SFX.inhale();
  } else if (!K.act || pl.floating || pl.mouthful) {
    pl.inhaling = 0;
  }

  if (canAct && P.act && pl.floating){          // air puff, ends the float
    pl.floating = false;
    projs.push({ kind:'puff', x: pl.x + (pl.dir>0?12:-10), y: pl.y+3, w:12, h:12,
                 vx: pl.dir*2.4, vy:0, life:16, dmg:1 });
    SFX.spit();
  }
  if (canAct && P.act && pl.mouthful){          // spit stars BOTH ways, clear across the screen
    for (const d of [1, -1]){
      projs.push({ kind:'star', x: pl.x + (d>0?12:-12), y: pl.y+1, w:12, h:12,
                   vx: d*6.2, vy:0, life:220, dmg:1, spin: d>0 ? 0 : 1.6, pierce:3 });
    }
    pl.mouthful = null; pl.squish = 0.4; SFX.spit();
    puffRing(pl.x + 7, pl.y + 6);
  }
  if (pl.spikeT > 0){ pl.spikeT--; spikeAttack(); }
  else if (pl.spikeCool > 0 && --pl.spikeCool === 0 && pl.spiky) SFX.flap();
  if (canAct && P.down && !pl.mouthful && pl.spiky && !pl.spikeT && !pl.spikeCool){   // spikes!
    pl.spikeT = SPIKE_TIME; pl.spikeCool = SPIKE_REST; pl.spikeHitBoss = false;
    pl.floating = false; pl.inhaling = 0;
    SFX.spikes(); game.shake = 3;
  }
  if (canAct && P.down && pl.mouthful){         // swallow
    const ate = pl.mouthful.type;
    pl.mouthful = null; game.score += 200; SFX.eat();
    if (ate === 'flyer') giveWings();
    if (ate === 'spiky') giveSpikes();
    floatText(pl.x+2, pl.y-6, '+200', '#ffd93b');
    if (Math.random() < 0.34 && pl.hp < pl.maxhp){ pl.hp++; floatText(pl.x, pl.y-16, 'YUM!', '#ff8fb1'); }
  }

  /* ---- gravity ---- */
  const g  = pl.floating ? F_GRAV : GRAV;
  const mf = pl.floating ? F_MAXFALL : MAXFALL;
  pl.vy = Math.min(pl.vy + g, mf);
  if (pl.floating && pl.vy < -3) pl.vy = -3;

  /* ---- move ---- */
  const r = moveBox(pl, pl.vx, 0);
  if (r.hitX) pl.vx = 0;
  const r2 = moveBox(pl, 0, pl.vy);
  const wasAir = !pl.onGround;
  pl.onGround = false;
  if (r2.hitY){
    if (pl.vy > 0){
      pl.onGround = true;
      if (wasAir && pl.vy > 3) pl.squish = 0.5;
      pl.floating = false; pl.floatT = 0; pl.tired = false;
    }
    pl.vy = 0;
  }
  if (pl.onGround) pl.walkT += Math.abs(pl.vx) * 0.18; else pl.walkT += 0.03;

  /* ---- can't float out the top of the world ---- */
  if (pl.y < 1){ pl.y = 1; if (pl.vy < 0) pl.vy = 0; }

  /* ---- hazards & falling out ---- */
  if (boxHazard(pl.x+2, pl.y+2, pl.w-4, pl.h-2)) hurtPlayer(pl.x + pl.w/2 < 0 ? 1 : -pl.dir, 2);
  if (pl.y > MAPH*TS + 40) killPlayer();

  /* ---- suction ---- */
  if (pl.inhaling > 3) doSuction();
}

function doSuction(){
  const reach = 56, mx = pl.x + pl.w/2 + pl.dir*8, my = pl.y + pl.h/2;
  const zone = { x: pl.dir>0 ? pl.x+10 : pl.x+pl.w-10-reach, y: pl.y - 8, w: reach, h: pl.h + 14 };
  if (game.t % 3 === 0){
    parts.push({ x: zone.x + Math.random()*zone.w, y: zone.y + Math.random()*zone.h,
                 vx: 0, vy: 0, tx: mx, ty: my, life: 14, kind:'suck', col:'#ffffff' });
  }
  const pull = (o, strength, canEat, onEat) => {
    const ox = o.x + o.w/2, oy = o.y + o.h/2;
    if (!hit(zone, o)) return;
    const dx = mx - ox, dy = my - oy, d = Math.hypot(dx,dy) || 1;
    o.x += (dx/d) * strength; o.y += (dy/d) * strength;
    if (o.vy !== undefined) o.vy = 0;
    if (canEat && d < 11) onEat();
  };
  for (const e of enemies){
    if (e.state !== 'live') continue;
    e.state = 'pulled';
  }
  for (const e of enemies){
    if (e.state === 'pulled'){
      if (!hit(zone, e)){ e.state = 'live'; continue; }
      pull(e, e.heavy ? 0.45 : 2.1, true, () => {     // spiky guys are heavy: it takes a while
        e.state = 'gone'; pl.mouthful = { type: e.type }; pl.inhaling = 0; pl.squish = 0.45;
        SFX.eat();
      });
      if (e.state === 'pulled') e.state = 'pulled';
    }
  }
  enemies = enemies.filter(e => e.state !== 'gone');
  for (const p of pickups){
    if (p.kind === 'star'){
      pull(p, 2.2, true, () => { p.dead = true; pl.mouthful = { type:'star' }; pl.inhaling = 0; SFX.eat(); });
    } else {
      pull(p, 1.4, false);
    }
  }
}

function hurtPlayer(kdir, dmg){
  if (pl.inv > 0 || pl.dead) return;
  pl.hp -= (dmg || 1);
  pl.inv = 96; pl.hurtT = 20;
  pl.vx = kdir * 2.2; pl.vy = -2.6;
  pl.floating = false; pl.inhaling = 0;
  if (pl.mouthful){
    pl.mouthful = null;
    pickups.push(mkStar(pl.x, pl.y - 4, -kdir*1.5));
  }
  game.shake = 8;
  SFX.hurt();
  for (let i=0;i<8;i++) parts.push(spark(pl.x+7, pl.y+7, '#ff8fb1'));
  if (pl.hp <= 0) killPlayer();
}

function killPlayer(force){
  if (pl.dead) return;
  pl.dead = true; pl.hp = 0;
  game.state = 'dead'; game.timer = 96;
  pl.vy = -5; pl.vx = 0; pl.floating = false; pl.inhaling = 0; pl.mouthful = null;
  SFX.die();
}

/* ============================================================
   PARTICLES / TEXT
   ============================================================ */
function spark(x,y,col){
  const a = Math.random()*Math.PI*2, s = .6 + Math.random()*1.9;
  return { x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - .5, life: 18 + Math.random()*14, kind:'dot', col };
}
function puffRing(x,y){
  for (let i=0;i<5;i++){
    const a = Math.PI*0.25 + Math.random()*Math.PI*0.5;
    parts.push({ x, y, vx: Math.cos(a)*(Math.random()-.5)*2, vy: Math.sin(a)*1.2,
                 life: 14, kind:'ring', col:'#ffffff' });
  }
}
function poof(x,y,col,n){
  for (let i=0;i<(n||10);i++) parts.push(spark(x,y,col));
}
function floatText(x,y,s,col){ texts.push({ x, y, s, col, life: 46 }); }

function updateParts(){
  for (const p of parts){
    if (p.kind === 'suck'){
      p.x += (p.tx - p.x) * 0.22;
      p.y += (p.ty - p.y) * 0.22;
    } else {
      p.x += p.vx; p.y += p.vy;
      if (p.kind === 'dot') p.vy += 0.12;
      p.vx *= 0.96;
    }
    p.life--;
  }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts){ t.y -= 0.5; t.life--; }
  texts = texts.filter(t => t.life > 0);
}

/* ============================================================
   ENEMIES
   ============================================================ */
function updateEnemies(){
  for (const e of enemies){
    e.t++;
    if (e.stun > 0) e.stun--;
    if (e.state === 'pulled') continue;      // suction owns it this frame

    if (e.type === 'flyer'){
      const dx = (pl.x - e.x);
      e.vx = Math.sign(dx || 1) * e.spd * 0.8;
      if (Math.abs(dx) > 200) e.vx = -e.spd;
      e.dir = e.vx < 0 ? -1 : 1;
      e.y = e.homeY + Math.sin(e.t * 0.055) * 16;
      const r = moveBox(e, e.vx, 0);
      if (r.hitX){ e.homeY -= 0; e.x += -e.vx*2; }
    } else {
      // walkers & spikies
      e.vx = e.dir * e.spd;
      e.vy = Math.min(e.vy + GRAV, MAXFALL);
      const r = moveBox(e, e.vx, 0);
      if (r.hitX) e.dir *= -1;
      const r2 = moveBox(e, 0, e.vy);
      if (r2.hitY){ if (e.vy > 0) e.onGround = true; e.vy = 0; }
      // don't walk off ledges
      if (e.onGround){
        const footX = e.dir > 0 ? e.x + e.w + 2 : e.x - 2;
        if (!solidPx(footX, e.y + e.h + 3)) e.dir *= -1;
      }
      if (boxHazard(e.x, e.y, e.w, e.h)) e.dir *= -1;
    }
    if (e.y > MAPH*TS + 60) e.state = 'gone';

    // touching Kolby hurts
    if (e.state === 'live' && hit(e, pl) && !pl.dead && !pl.spikeT)
      hurtPlayer(pl.x + pl.w/2 < e.x + e.w/2 ? -1 : 1, 1);
  }
  enemies = enemies.filter(e => e.state !== 'gone');
}

function killEnemy(e, byStar){
  e.state = 'gone';
  game.score += 100;
  poof(e.x + e.w/2, e.y + e.h/2, e.type === 'spiky' ? '#c9a2ff' : '#ffb3c7', 12);
  floatText(e.x, e.y - 4, '+100', '#fff6d8');
  SFX.boom();
}

/* ============================================================
   PROJECTILES
   ============================================================ */
function updateProjs(){
  for (const p of projs){
    p.life--;
    if (p.spin !== undefined) p.spin += 0.4;
    const r = moveBox(p, p.vx, p.vy || 0);
    if (r.hitX || r.hitY){
      // stars smash bricks — and punch straight on through if they have any left in them
      const tx = Math.floor((p.x + p.w/2 + Math.sign(p.vx)*8) / TS);
      const ty = Math.floor((p.y + p.h/2) / TS);
      let smashed = false;
      if (p.kind === 'star' && tileAt(tx,ty) === 'X'){
        map[ty][tx] = '.';
        poof(tx*TS+8, ty*TS+8, '#e8a05a', 12);
        game.score += 20;
        SFX.boom();
        smashed = true;
      }
      if (smashed && p.pierce > 0) p.pierce--;
      else { p.life = 0; poof(p.x + p.w/2, p.y + p.h/2, '#fff6d8', 5); }
    }
    for (const e of enemies){
      if (e.state === 'gone') continue;
      if (hit(p, e)){
        killEnemy(e, true);
        poof(p.x+6, p.y+6, '#fff6d8', 6);
        if (p.pierce > 0) p.pierce--;      // barrels on to the next one
        else { p.life = 0; break; }
      }
    }
    if (boss && boss.dead === 0 && p.kind === 'star' && hit(p, boss)) hurtBoss(p);
  }
  projs = projs.filter(p => p.life > 0);
}

/* ============================================================
   PICKUPS
   ============================================================ */
function updatePickups(){
  for (const p of pickups){
    p.t++;
    if (p.phys){
      p.life--;
      p.vy = Math.min(p.vy + GRAV*0.8, 5);
      const r = moveBox(p, p.vx, 0); if (r.hitX) p.vx *= -0.7;
      const r2 = moveBox(p, 0, p.vy);
      if (r2.hitY){
        if (p.vy > 0){                      // settle after a couple of hops
          p.vy = Math.abs(p.vy) > 1.4 ? -Math.abs(p.vy)*0.42 : 0;
          p.vx *= 0.72;
        } else p.vy = 0;
      }
      p.vx *= 0.995;
      if (p.life <= 0) p.dead = true;
    }
    if (p.dead) continue;
    if (hit(p, pl) && !pl.dead){
      if (p.kind === 'banana'){
        game.bananas++; game.score += 10; p.dead = true; SFX.pick();
        floatText(p.x, p.y-4, '+10', '#ffd93b');
        if (game.bananas % 25 === 0){ game.lives++; toast('1UP! bananas!'); SFX.clear(); }
      } else if (p.kind === 'heart'){
        pl.hp = Math.min(pl.maxhp, pl.hp + 2); p.dead = true; SFX.pick();
        floatText(p.x, p.y-4, 'HP+2', '#ff8fb1');
      } else if (p.kind === 'life'){
        game.lives++; p.dead = true; SFX.clear();
        floatText(p.x, p.y-6, '1UP', '#9dffb0');
      }
      // stars are not "collected" — you inhale them
    }
  }
  pickups = pickups.filter(p => !p.dead);
}

/* ============================================================
   BOSS — KING PEELA
   ============================================================ */
function hurtBoss(p){
  p.life = 0;
  boss.hp--; boss.flash = 18; game.shake = 10;
  boss.vx = Math.sign(p.vx) * 1.6; boss.vy = -2;
  poof(boss.x + boss.w/2, boss.y + 10, '#ffd93b', 16);
  game.score += 300;
  SFX.bosshit();
  if (boss.hp <= 0){
    boss.dead = 1; boss.state = 'dying'; boss.t = 120;
    SFX.die();
  }
}
function updateBoss(){
  if (!boss) return;
  const b = boss;
  b.t--;
  if (b.flash > 0) b.flash--;
  b.hintT = (b.hintT || 0) + 1;
  if (b.hp === b.maxhp && b.hintT > 780){
    b.hintT = 0;
    toast(pl.mouthful ? 'you got one!  press X to SPIT it at him!'
                      : 'hold X near a star to suck it up!', 300);
  }

  if (b.state === 'dying'){
    b.vy = Math.min(b.vy + GRAV, MAXFALL);
    moveBox(b, 0, b.vy);
    if (game.t % 6 === 0) poof(b.x + Math.random()*b.w, b.y + Math.random()*b.h, '#ffd93b', 5);
    if (b.t <= 0){
      poof(b.x + b.w/2, b.y + b.h/2, '#fff6d8', 40);
      game.shake = 16; SFX.boom();
      game.score += 3000;
      boss = null;
      if (doorObj){ doorObj.open = true; doorObj.t = 0; }
      floatText(pl.x, pl.y - 20, 'PEELED!', '#ffd93b');
      toast('the warp star appeared!');
    }
    return;
  }

  b.dir = (pl.x + 7 < b.x + b.w/2) ? -1 : 1;

  switch (b.state){
    case 'wait':
      b.vx *= 0.85;
      if (b.t <= 0){ b.state = Math.random() < 0.45 ? 'throw' : 'hop'; b.hops = 3; b.t = 20; }
      break;
    case 'hop':
      if (b.onGround && b.t <= 0){
        b.vy = -5.6; b.vx = b.dir * 1.5; b.onGround = false; b.hops--;
        b.t = 24;
      }
      break;
    case 'throw':
      if (b.t <= 0){
        b.vx = 0;
        projs.push({ kind:'peel', x: b.x + (b.dir>0? b.w : -12), y: b.y + 12, w:12, h:10,
                     vx: b.dir*2.6, vy:-1.2, life:150, spin:0, enemy:true });
        SFX.spit();
        b.hops = (b.hops || 0) - 1;
        b.t = 34;
        if (b.hops <= 0){ b.state = 'wait'; b.t = 60; }
      }
      break;
  }

  b.vy = Math.min(b.vy + GRAV*0.9, MAXFALL);
  const rx = moveBox(b, b.vx, 0); if (rx.hitX) b.vx = 0;
  const wasAir = !b.onGround;
  b.onGround = false;
  const ry = moveBox(b, 0, b.vy);
  if (ry.hitY){
    if (b.vy > 0){
      b.onGround = true;
      if (wasAir && b.vy > 3){                       // landing slam
        game.shake = 7; SFX.boom();
        poof(b.x + b.w/2, b.y + b.h, '#e8c07a', 10);
        if (pickups.filter(q => q.kind === 'star').length < 3)
          pickups.push(mkStar(b.x + b.w/2 - 6, b.y + b.h - 20, b.dir * -2));
        if (b.state === 'hop' && b.hops <= 0){ b.state = 'wait'; b.t = 50; }
      }
    }
    b.vy = 0;
  }
  if (b.state === 'hop' && !b.onGround) b.vx *= 0.995;

  if (hit(b, pl) && !pl.dead && !pl.spikeT) hurtPlayer(pl.x + 7 < b.x + b.w/2 ? -1 : 1, 1);
}

/* enemy projectiles (peels) hitting Kolby */
function checkEnemyProjs(){
  for (const p of projs){
    if (!p.enemy) continue;
    p.vy = Math.min((p.vy||0) + GRAV*0.35, 3);
    if (hit(p, pl) && !pl.dead && !pl.spikeT){
      hurtPlayer(Math.sign(p.vx) || 1, 1);
      p.life = 0;
    }
  }
}

/* ============================================================
   CAMERA / LEVEL FLOW
   ============================================================ */
function updateCamera(snap){
  const tx = Math.max(0, Math.min(MAPW*TS - W, pl.x + pl.w/2 - W/2));
  const ty = Math.max(0, Math.min(Math.max(0, MAPH*TS - H), pl.y + pl.h/2 - H/2 + 12));
  if (snap){ cam.x = tx; cam.y = ty; }
  else { cam.x += (tx - cam.x) * 0.14; cam.y += (ty - cam.y) * 0.10; }
}

function updateDoor(){
  if (!doorObj || !doorObj.open) return;
  doorObj.t++;
  if (hit(doorObj, pl) && !pl.dead && game.state === 'play'){
    game.state = 'clear'; game.timer = 170;
    SFX.clear();
    poof(pl.x+7, pl.y+7, '#ffd93b', 24);
  }
}

/* ============================================================
   DRAWING  —  flat fills, fat dark outlines, round everything
   ============================================================ */
const OUT = '#3a2a52';          // universal ink outline
const OUT_T = '#553a22';        // warmer ink for terrain

function rr(x,y,w,h,r){
  CX.beginPath();
  CX.moveTo(x+r,y);
  CX.arcTo(x+w,y,x+w,y+h,r);
  CX.arcTo(x+w,y+h,x,y+h,r);
  CX.arcTo(x,y+h,x,y,r);
  CX.arcTo(x,y,x+w,y,r);
  CX.closePath();
}
function circle(x,y,r){ CX.beginPath(); CX.arc(x,y,r,0,Math.PI*2); CX.closePath(); }
function ell(x,y,rx,ry,rot){ CX.beginPath(); CX.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,Math.PI*2); CX.closePath(); }
function ink(col,lw){ CX.fillStyle=col; CX.fill(); CX.strokeStyle=OUT; CX.lineWidth=lw||1.6; CX.stroke(); }
function txt(s,x,y,col,size,align,shadow){
  CX.font = 'bold ' + (size||10) + 'px "Trebuchet MS", Verdana, sans-serif';
  CX.textAlign = align || 'left';
  CX.textBaseline = 'top';
  if (shadow !== false){ CX.fillStyle = 'rgba(30,18,48,.6)'; CX.fillText(s, x+1, y+1); }
  CX.fillStyle = col; CX.fillText(s, x, y);
}
/* chunky outlined display text, the way a title card would do it */
function bigtxt(s,x,y,col,size,align,lw){
  CX.font = 'bold ' + size + 'px "Trebuchet MS", Verdana, sans-serif';
  CX.textAlign = align || 'center';
  CX.textBaseline = 'top';
  CX.lineJoin = 'round';
  CX.strokeStyle = OUT; CX.lineWidth = lw || 6; CX.strokeText(s,x,y);
  CX.fillStyle = col; CX.fillText(s,x,y);
}
function thash(tx,ty){
  let h = (tx*374761393 + ty*668265263) | 0;
  h = ((h ^ (h>>13)) * 1274126177) | 0;
  return ((h ^ (h>>16)) >>> 0) / 4294967295;
}

/* the eye everybody in this world has: dark top, white bottom, one shine */
function eye(x,y,rx,ry){
  CX.save();
  ell(x,y,rx,ry); CX.clip();
  CX.fillStyle = '#2b2350'; CX.fillRect(x-rx-1, y-ry-1, rx*2+2, ry*2+2);
  CX.fillStyle = '#ffffff'; CX.fillRect(x-rx-1, y+ry*0.18, rx*2+2, ry+1);
  CX.restore();
  CX.fillStyle = '#ffffff'; ell(x-rx*0.12, y-ry*0.45, rx*0.52, ry*0.3); CX.fill();
  CX.strokeStyle = OUT; CX.lineWidth = 0.9; ell(x,y,rx,ry); CX.stroke();
}
function blush(x,y,rx,ry){ CX.fillStyle='#ff8fb1'; ell(x,y,rx,ry); CX.fill(); }

/* ---------------- backdrop ---------------- */
function puffCloud(x,y,s,alpha){
  CX.globalAlpha = alpha === undefined ? 1 : alpha;
  CX.fillStyle = '#ffffff';
  circle(x, y, 11*s); CX.fill();
  circle(x+12*s, y+3*s, 8.5*s); CX.fill();
  circle(x-12*s, y+4*s, 7.5*s); CX.fill();
  circle(x+4*s, y-6*s, 8*s); CX.fill();
  CX.fillStyle = '#d9edff';
  ell(x, y+8*s, 15*s, 3.5*s); CX.fill();
  CX.globalAlpha = 1;
}
function tree(x, groundY, leaf, leafL){
  CX.fillStyle = '#9a6238';
  rr(x-4.5, groundY-30, 9, 32, 3); CX.fill();
  CX.strokeStyle = OUT_T; CX.lineWidth = 1.6; rr(x-4.5, groundY-30, 9, 32, 3); CX.stroke();
  CX.fillStyle = leaf || '#5cc244'; CX.strokeStyle = OUT_T; CX.lineWidth = 1.8;
  circle(x, groundY-40, 16);   CX.fill(); CX.stroke();
  circle(x-12, groundY-33, 9); CX.fill(); CX.stroke();
  circle(x+12, groundY-33, 9); CX.fill(); CX.stroke();
  CX.fillStyle = leafL || '#7ee05f';
  circle(x-5, groundY-46, 6.5); CX.fill();
  circle(x+6, groundY-43, 4.5); CX.fill();
}

/* wraps a backdrop piece around the screen as the camera scrolls; par = how far away it is */
function loopX(x, par, pad){
  const span = W + pad*2;
  return ((x - cam.x*par) % span + span) % span - pad;
}
/* how far the camera still is from the bottom of a tall level (0 on normal ones) */
function climb(){ return Math.max(0, MAPH*TS - H) - cam.y; }

/* things that float down the screen forever — leaves, sugar */
function drift(n, speed, sway, draw){
  for (let i=0;i<n;i++){
    const y = ((i*53 + game.t*speed*(0.7 + (i%4)*0.15)) % (H + 20)) - 10;
    const x = loopX(i*71 + Math.sin(game.t*0.015 + i*1.7)*sway, .5, 20);
    draw(x, y, i);
  }
}
function skyTwinkles(n){
  for (let i=0;i<n;i++){
    const sx = loopX(thash(i,5)*(W + 80), .12, 40), sy = 12 + thash(i,6)*90;
    const tw = 0.5 + 0.5*Math.sin(game.t*0.06 + i);
    CX.globalAlpha = 0.25 + tw*0.5;
    drawStarShape(sx, sy, 2 + tw*1.4, i, '#ffffff', null);
    CX.globalAlpha = 1;
  }
}

/* a maple tapped for syrup: spout, bucket, and a drop now and then */
function syrupTap(x, groundY, i){
  const y = groundY - 16;
  CX.fillStyle = '#8c96b0'; CX.fillRect(x + 4, y - 1, 5, 2);
  const f = (game.t + i*23) % 70;
  if (f < 20){ CX.fillStyle = '#e0891f'; ell(x + 8.5, y + 2 + f*0.3, 1.1, 1.5); CX.fill(); }
  rr(x + 4.5, y + 7, 9, 9, 2); ink('#c3cbe0', 1.4);
  CX.fillStyle = '#e0891f'; CX.fillRect(x + 6, y + 8.5, 6, 2);
}
/* a pudding floating far off in the custard sky */
function flan(x, y, s){
  CX.save(); CX.translate(x, y); CX.scale(s, s);
  CX.globalAlpha = .75;
  CX.fillStyle = '#ffffff'; ell(0, 11, 21, 3.4); CX.fill();
  CX.beginPath();
  CX.moveTo(-16, 10); CX.lineTo(-11, -8); CX.quadraticCurveTo(0, -12, 11, -8);
  CX.lineTo(16, 10); CX.quadraticCurveTo(0, 13, -16, 10); CX.closePath();
  CX.fillStyle = '#ffe08a'; CX.fill();
  CX.clip();
  CX.fillStyle = '#c9772a'; CX.fillRect(-20, -14, 40, 9);
  for (let k=-2;k<=2;k++){ circle(k*5.5, -5 + (k%2 ? 2.5 : 0), 2.6); CX.fill(); }
  CX.restore();
  CX.save(); CX.translate(x, y); CX.scale(s, s); CX.globalAlpha = .75;
  CX.fillStyle = '#ff4f6d'; circle(0, -12.5, 3.2); CX.fill();
  CX.restore();
}
/* sugar mountains with frosting poured over the peaks */
function mountains(par, base, col, tall, seed){
  for (let i=0;i<5;i++){
    const mx = loopX(i*170 + seed*85, par, 150);
    const top = base - tall - ((i + seed) % 3)*22, wd = 100 + ((i*7 + seed) % 3)*20;
    CX.save();
    CX.beginPath();
    CX.moveTo(mx - wd, base); CX.lineTo(mx - 10, top + 8);
    CX.quadraticCurveTo(mx, top - 2, mx + 10, top + 8);
    CX.lineTo(mx + wd, base); CX.closePath();
    CX.fillStyle = col; CX.fill();
    CX.clip();
    const sy = top + 24;
    CX.fillStyle = '#ffffff';
    CX.fillRect(mx - wd, top - 4, wd*2, sy - top + 4);
    for (let k=-6;k<=6;k++){
      const drip = ((k*k*7 + i*3 + seed) % 4) * 3;
      circle(mx + k*6.5, sy, 3.6); CX.fill();
      rr(mx + k*6.5 - 2.4, sy, 4.8, 3 + drip, 2.4); CX.fill();
    }
    CX.restore();
  }
}
/* a banana peel dangling off the cave roof */
function peel(x, y, s, col, rot){
  CX.save(); CX.translate(x, y); CX.rotate(rot || 0); CX.scale(s, s);
  CX.fillStyle = col;
  for (const k of [-1, 0, 1]){
    CX.beginPath();
    CX.moveTo(-3, 0);
    CX.quadraticCurveTo(k*11 - 3, 12, k*9, 26 - Math.abs(k)*6);
    CX.quadraticCurveTo(k*6 + 2, 12, 3, 0);
    CX.closePath(); CX.fill();
  }
  CX.fillStyle = '#3a2a1e'; rr(-2.5, -5, 5, 6, 1.5); CX.fill();
  CX.restore();
}
/* a leaning palm with a bunch of nanas under its leaves */
function palm(x, groundY, lean){
  for (let k=0;k<7;k++){
    ell(x + lean*k*k*0.45, groundY - k*8, 5.4 - k*0.3, 4.6, lean*k*0.05); ink('#c08a4e', 1.3);
  }
  const tx = x + lean*16.2, ty = groundY - 54;
  drawBanana(tx - 3, ty + 8, 1.1); drawBanana(tx + 2, ty + 9, 1.1);
  for (let f=0; f<6; f++){
    const a = -Math.PI/2 + (f - 2.5)*0.55 + Math.sin(game.t*0.03 + f)*0.05;
    const ex = tx + Math.cos(a)*28, ey = ty + Math.sin(a)*16 + 12;
    CX.beginPath(); CX.moveTo(tx, ty);
    CX.quadraticCurveTo(tx + Math.cos(a)*17, ty + Math.sin(a)*17 - 8, ex, ey);
    CX.quadraticCurveTo(tx + Math.cos(a)*14, ty + Math.sin(a)*14 + 2, tx, ty + 3);
    ink(f%2 ? '#3fb44f' : '#52c75a', 1.4);
  }
}
/* a big floppy jungle leaf growing out of the ground */
function bigLeaf(x, groundY, d, rot){
  CX.save(); CX.translate(x, groundY); CX.rotate(rot); CX.scale(d, 1);
  CX.beginPath(); CX.moveTo(0, 0);
  CX.quadraticCurveTo(-6, -30, 16, -52);
  CX.quadraticCurveTo(28, -24, 0, 0);
  CX.closePath(); ink('#3fae4a', 1.6);
  CX.strokeStyle = '#2c7a3a'; CX.lineWidth = 1.1;
  CX.beginPath(); CX.moveTo(1, -2); CX.quadraticCurveTo(8, -28, 16, -50); CX.stroke();
  CX.restore();
}
function vine(x, len, i){
  const sway = s => Math.sin(game.t*0.02 + i + s*0.05) * 4 * (s/len);
  CX.strokeStyle = '#2c7a3a'; CX.lineWidth = 2;
  CX.beginPath(); CX.moveTo(x, 0);
  for (let s=6; s<=len; s+=6) CX.lineTo(x + sway(s), s);
  CX.stroke();
  for (let s=12; s<=len; s+=12){
    const d = (s/12) % 2 ? 1 : -1;
    CX.fillStyle = '#4cbf4f'; ell(x + sway(s) + d*3.6, s, 3.8, 1.9, d*0.5); CX.fill();
  }
}
/* the moon is a moonpie somebody took a bite out of, and it's asleep */
function moonpie(x, y, r){
  const bx = x + r*0.8, by = y - r*0.55, br = r*0.42;
  CX.fillStyle = 'rgba(255,240,190,.12)'; circle(x, y, r + 14); CX.fill();
  CX.fillStyle = 'rgba(255,240,190,.2)';  circle(x, y, r + 6);  CX.fill();
  CX.save();
  CX.beginPath(); CX.rect(x - r - 20, y - r - 20, r*2 + 40, r*2 + 40);
  CX.arc(bx, by, br, 0, Math.PI*2, true);
  CX.clip('evenodd');
  circle(x, y, r); ink('#fff1c2', 2);
  CX.fillStyle = '#f2d890';
  circle(x - r*.35, y + r*.45, r*.16); CX.fill();
  circle(x + r*.32, y + r*.52, r*.1);  CX.fill();
  circle(x - r*.62, y - r*.18, r*.09); CX.fill();
  CX.restore();
  CX.save(); circle(x, y, r); CX.clip();
  CX.strokeStyle = OUT; CX.lineWidth = 2; circle(bx, by, br); CX.stroke();
  CX.restore();
  CX.strokeStyle = OUT; CX.lineWidth = 1.4; CX.lineCap = 'round';
  for (const ex of [x - r*.4, x + r*.1]){
    CX.beginPath(); CX.arc(ex, y - r*.08, r*.13, .2, Math.PI - .2); CX.stroke();
  }
  CX.lineCap = 'butt';
  blush(x - r*.62, y + r*.18, r*.14, r*.09); blush(x + r*.3, y + r*.18, r*.14, r*.09);
  CX.fillStyle = '#7d2438'; ell(x - r*.15, y + r*.3, r*.07, r*.09); CX.fill();
}
function candyCane(x, top, bottom){
  const w = 12;
  CX.save();
  CX.lineCap = 'butt';
  CX.strokeStyle = '#d9bfcb'; CX.lineWidth = w;
  CX.beginPath(); CX.moveTo(x, bottom); CX.lineTo(x, top); CX.arc(x + 11, top, 11, Math.PI, 0); CX.lineTo(x + 22, top + 8); CX.stroke();
  CX.strokeStyle = '#b8456a'; CX.setLineDash([4, 6]);
  CX.beginPath(); CX.moveTo(x, bottom); CX.lineTo(x, top); CX.arc(x + 11, top, 11, Math.PI, 0); CX.lineTo(x + 22, top + 8); CX.stroke();
  CX.setLineDash([]);
  CX.restore();
}
function lollipop(x, groundY, h, col){
  CX.fillStyle = '#f3e6ee'; rr(x - 1.6, groundY - h, 3.2, h, 1.5); CX.fill();
  const cy = groundY - h, r = 11;
  circle(x, cy, r); ink(col, 1.6);
  CX.save(); circle(x, cy, r); CX.clip();
  CX.strokeStyle = 'rgba(255,255,255,.75)'; CX.lineWidth = 2.2;
  CX.beginPath();
  for (let a=0; a<Math.PI*6; a+=0.3){
    const d = a/(Math.PI*6)*r, s = a + game.t*0.02;
    CX.lineTo(x + Math.cos(s)*d, cy + Math.sin(s)*d);
  }
  CX.stroke();
  CX.restore();
  CX.fillStyle = 'rgba(255,255,255,.6)'; ell(x - 4, cy - 5, 3, 1.8, -.5); CX.fill();
}
